<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Axiom Engine — Truth Is Ontological | David Lowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1218;--panel:#151c25;--panel2:#1b2531;--ink:#e6edf4;--mut:#8ea3b8;--dim:#5c6d80;
  --line:#2b3a4b;--grid:rgba(73,180,224,.045);--accent:#49b4e0;
  --gold:#d9a94a;--green:#5bbf8a;--purple:#8f7fe0;--orange:#e08f6a;--cyan:#49b4e0;
  --goldbg:#2b2413;--greenbg:#132318;--purplebg:#221f33;--orangebg:#2a1f18;--cyanbg:#0f2530;
  --ok:#5bbf8a;--bad:#c0433a;--badl:#c8695f;--q:#7aa2f0;--qbg:#141c2e;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.mono{font-family:"JetBrains Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
/* ============ top nav ============ */
#topnav{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:10px 18px;background:rgba(14,18,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#topnav .brand{font:700 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-right:10px;cursor:pointer;white-space:nowrap}
#topnav .brand small{display:block;font-size:8.5px;color:var(--dim);letter-spacing:.24em;margin-top:3px}
.navlink{font:600 11.5px/1 Inter,ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding:8px 11px;border-radius:7px;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.navlink:hover{color:var(--ink);text-decoration:none}
.navlink.on{color:var(--gold);border-color:rgba(217,169,74,.4);background:var(--goldbg)}
#searchwrap{position:relative;margin-left:auto}
#search{width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:7px 11px;font:400 12.5px/1 Inter,ui-sans-serif;outline:none}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(73,180,224,.18)}
#search::placeholder{color:var(--dim)}
#sdrop{position:absolute;top:calc(100% + 6px);right:0;width:min(420px,92vw);max-height:340px;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:90;display:none}
#sdrop.on{display:block}
.sitem{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:baseline}
.sitem:last-child{border-bottom:0}
.sitem:hover,.sitem.sel{background:var(--panel2)}
.sitem .sid{font:700 11px/1.3 "JetBrains Mono",ui-monospace,monospace;white-space:nowrap}
.sitem .stit{font-size:12px;color:var(--ink);line-height:1.3}
.sitem .sctx{font-size:10.5px;color:var(--dim);line-height:1.3}
.snone{padding:10px 12px;font-size:12px;color:var(--mut)}
/* ============ shared ============ */
main{display:block}
.page{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.eyebrow{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1.pagetitle{font-family:Cinzel,Georgia,serif;font-size:clamp(22px,3vw,32px);margin:.35em 0 .15em;letter-spacing:.04em;color:#e8d5a3;font-weight:700}
.sub{color:var(--mut);max-width:82ch;font-size:14px;line-height:1.6}
.sub b{color:var(--ink)}
.tierbadge{display:inline-block;font:700 9.5px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 8px;border-radius:5px;border:1px solid var(--tc);color:var(--tc);background:var(--tbg)}
.t-AX_CORE{--tc:var(--gold);--tbg:var(--goldbg)}
.t-AX_DERIVED{--tc:var(--green);--tbg:var(--greenbg)}
.t-AX_SCAFFOLD{--tc:var(--purple);--tbg:var(--purplebg)}
.t-FW_EXTENDED{--tc:var(--orange);--tbg:var(--orangebg)}
.t-HY_EVIDENCE{--tc:var(--cyan);--tbg:var(--cyanbg)}
.tierchip{display:inline-block;font:700 9px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em;padding:3px 7px;border-radius:4px;
  border:1px solid var(--tc);color:var(--tc);background:var(--tbg);text-transform:uppercase;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px/1.2 "JetBrains Mono",ui-monospace,monospace;padding:6px 9px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .cnote{color:var(--dim);font-weight:400}
/* math (from engine) */
.math{font-family:Georgia,'Times New Roman',serif;white-space:nowrap}
.math i,.dmath i{font-style:italic}
.math .fn,.dmath .fn{font-style:normal}
.math .op{font-size:1.22em;line-height:1}
.dmath{display:block;text-align:center;margin:.9em 0;font-family:Georgia,'Times New Roman',serif;font-size:1.35em;overflow-x:auto;padding:.5em 0;line-height:1.6;color:#efe3c2}
.frac{display:inline-flex;flex-direction:column;vertical-align:-.55em;text-align:center;margin:0 .18em;font-size:.92em}
.frac .fnum{border-bottom:1.5px solid currentColor;padding:0 .35em .08em;line-height:1.25}
.frac .fden{padding:.08em .35em 0;line-height:1.25}
.rad .radicand{border-top:1.5px solid currentColor;padding:0 .15em}
.boxed{border:1.5px solid currentColor;border-radius:3px;padding:.08em .35em}
.envc{display:inline-block;text-align:left;vertical-align:middle}
.envc .erow{display:block;line-height:1.5}
.lbrace{font-size:2.1em;line-height:1;vertical-align:-.28em;font-weight:200;margin-right:.08em}
.xarr{display:inline-grid;grid-template-rows:auto auto;text-align:center;vertical-align:middle;line-height:1.1}
.xarr .xlab{font-size:.72em}
.xarr .xglyph{font-size:1.05em}
/* prose (rich) */
.prose{font-size:14px;line-height:1.7;color:var(--ink)}
.prose p{margin:0 0 .8em}
.prose ul,.prose ol{margin:.2em 0 .9em;padding-left:1.4em}
.prose li{margin-bottom:.4em}
.prose h4{font:600 12.5px/1.3 "JetBrains Mono",ui-monospace,monospace;color:var(--gold);margin:1.3em 0 .5em;letter-spacing:.03em}
.prose strong{font-weight:700;color:#f0e9d8}
/* ============ map view ============ */
#mapwrap{position:relative;height:calc(100vh - 49px);min-height:520px;overflow:hidden}
#mapsvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#mapsvg.dragging{cursor:grabbing}
.mapctrl{position:absolute;top:14px;left:16px;z-index:20;display:flex;flex-direction:column;gap:8px;max-width:min(430px,92vw)}
.mcpanel{background:rgba(21,28,37,.92);border:1px solid var(--line);border-radius:10px;padding:10px 13px;backdrop-filter:blur(6px)}
.mctitle{font:700 10.5px/1.5 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.mctitle small{display:block;color:var(--dim);letter-spacing:.1em;font-weight:400;margin-top:2px;text-transform:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--mut);border:0;padding:7px 12px;font:600 11.5px/1 Inter,ui-sans-serif;cursor:pointer;letter-spacing:.04em}
.seg button.on{background:var(--gold);color:#161207;font-weight:700}
.mcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mcrow label{font:600 10px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
input[type=range]{accent-color:var(--gold);width:110px}
.zbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--mut);cursor:pointer;font:700 13px/1 ui-monospace,monospace}
.zbtn:hover{color:var(--ink);border-color:var(--accent)}
.legend{position:absolute;left:16px;bottom:14px;z-index:20;background:rgba(21,28,37,.92);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;font-size:11px;color:var(--mut);line-height:1.8;backdrop-filter:blur(6px)}
.legend .lg{display:flex;align-items:center;gap:7px}
.legend .sw{width:10px;height:10px;border-radius:50%;border:2px solid var(--tc);background:transparent}
.legend .sw.f{background:var(--tc)}
.legend b{color:var(--ink)}
#kobanner{position:absolute;top:14px;right:16px;z-index:30;max-width:min(400px,90vw);display:none}
#kobanner.on{display:block}
.kobox{background:rgba(21,28,37,.95);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:10px;padding:12px 15px;font-size:12.5px;line-height:1.55}
.kobox b{color:var(--badl)}
.kobox .rest{margin-left:8px;cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dashed var(--accent)}
#selcard{position:absolute;right:16px;bottom:14px;z-index:25;width:min(360px,92vw);background:rgba(21,28,37,.95);border:1px solid var(--line);
  border-top:3px solid var(--tc,var(--gold));border-radius:10px;padding:13px 15px;display:none;backdrop-filter:blur(6px)}
#selcard.on{display:block}
#selcard .sid{font:700 11px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--tc,var(--gold));letter-spacing:.05em}
#selcard h3{margin:5px 0 5px;font-size:15.5px;line-height:1.25}
#selcard .sclaim{font-size:11.5px;color:var(--mut);line-height:1.45;max-height:4.4em;overflow:hidden}
#selcard .smeta{margin-top:8px;font:500 10.5px/1.7 "JetBrains Mono",ui-monospace,monospace;color:var(--dim)}
#selcard .srow{display:flex;gap:8px;margin-top:10px}
.sbtn{flex:1;text-align:center;border-radius:7px;padding:8px 6px;cursor:pointer;font:600 11.5px/1.3 Inter,ui-monospace,monospace;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.ko{border-color:#8a3b34;color:var(--badl)}
.sbtn.ko:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
/* map hint when empty space */
.maphint{position:absolute;right:16px;top:14px;z-index:15;font:500 10.5px/1.7 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);text-align:right;pointer-events:none}
#kobanner.on ~ .maphint{display:none}
/* stars */
.star{cursor:pointer}
.star circle.core{fill:var(--bg)}
.star .halo{fill:none;stroke:var(--tc);stroke-opacity:.14}
.star .body{fill:#0b0f14;stroke:var(--tc);stroke-width:1.6}
.star.sel .body{stroke-width:2.6;fill:var(--tbg)}
.star.dim{opacity:.12}
.star.dead{opacity:.15}
.star.dead .body{stroke:var(--bad)}
.star text{font:600 9.5px/1 "JetBrains Mono",ui-monospace,monospace;fill:var(--mut);pointer-events:none}
.star.sel text,.star:hover text{fill:var(--ink)}
.star.ua .body{stroke-dasharray:3 3}
.edge{fill:none;stroke:var(--mut);stroke-opacity:.09;stroke-width:1}
.edge.hot{stroke:var(--accent);stroke-opacity:.55;stroke-width:1.4}
.edge.dead{stroke:var(--bad);stroke-opacity:.4;stroke-width:1.2}
.edge.ua{stroke-dasharray:4 4}
/* ============ node terminal ============ */
.crumbs{font:600 11px/1.9 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.04em;margin-bottom:14px;flex-wrap:wrap;display:flex;gap:4px;align-items:center}
.crumbs a{color:var(--mut)}
.crumbs a:hover{color:var(--accent);text-decoration:none}
.crumbs .sep{color:var(--dim);margin:0 3px}
.crumbs .here{color:var(--gold)}
.termgrid{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.termgrid{grid-template-columns:1fr}}
.tside{position:sticky;top:64px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;font-size:12.5px}
.tside h4{font:700 9.5px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:16px 0 7px}
.tside h4:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;line-height:1.5}
.kv dt{color:var(--dim);font:500 10.5px/1.6 "JetBrains Mono",ui-monospace,monospace}
.kv dd{margin:0}
.rmeter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px}
.rmeter i{display:block;height:100%;background:var(--gold);border-radius:2px}
.tmain{min-width:0}
.thead{border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:12px;background:var(--panel);padding:22px 26px;margin-bottom:18px}
.thead .rid{font:700 12px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--tc);letter-spacing:.05em}
.thead h2{margin:6px 0 8px;font-size:clamp(20px,2.6vw,27px);line-height:1.2;letter-spacing:-.01em}
.thead .rmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statement{background:var(--tbg);border:1px solid var(--line);border-radius:10px;padding:16px 19px;font-size:15px;line-height:1.65;margin-top:14px}
.rsec{margin:0 0 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.rsec>h3{font:700 10.5px/1 "JetBrains Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.15em;color:var(--tc,var(--mut));margin:0 0 13px;display:flex;gap:12px;align-items:center}
.rsec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.uabanner{border:1px dashed var(--orange);border-radius:8px;background:var(--orangebg);padding:10px 13px;font-size:12px;color:var(--orange);line-height:1.5;margin-top:14px}
.defeatbox{border-left:3px solid var(--bad);background:var(--panel2);border-radius:0 8px 8px 0;padding:13px 16px}
.defeatbox .dtag{font:700 10px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--badl);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:7px}
.nodef{border:1px solid #8a3b34;border-left:3px solid var(--bad);background:var(--panel2);border-radius:0 8px 8px 0;padding:13px 16px;font-size:13px;color:var(--badl);line-height:1.55}
.verdictbox{border-left:3px solid var(--green);background:var(--greenbg);border-radius:0 8px 8px 0;padding:13px 16px;margin-top:12px}
.verdictbox .dtag{font:700 10px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--green);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:7px}
details.xexam{border:1px solid var(--line);border-radius:8px;margin-top:10px;background:var(--panel2)}
details.xexam summary{cursor:pointer;padding:10px 13px;font:600 11px/1.4 "JetBrains Mono",ui-monospace,monospace;color:var(--accent);letter-spacing:.06em}
details.xexam .xbody{padding:2px 15px 14px}
.rnav{display:flex;gap:10px;margin-top:6px}
.rnavbtn{flex:1;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:11px 12px;cursor:pointer;font:600 12px/1.4 Inter,ui-sans-serif}
.rnavbtn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.rnavbtn:disabled{opacity:.35;cursor:default}
.rnavbtn .rnid{display:block;font:700 10px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);margin-bottom:4px;letter-spacing:.08em}
/* ============ chain ============ */
.chainsec{margin:26px 0 6px;font:700 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--tc,var(--gold));display:flex;gap:12px;align-items:center}
.chainsec::after{content:"";flex:1;height:1px;background:var(--line)}
.chainsec small{color:var(--dim);letter-spacing:.06em;font-weight:400;text-transform:none}
.crow{display:grid;grid-template-columns:52px 118px 1fr auto;gap:12px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.crow:hover{background:var(--panel);border-left-color:var(--tc)}
.crow .cpn{font:500 10.5px/1.4 "JetBrains Mono",ui-monospace,monospace;color:var(--dim)}
.crow .cid{font:700 11.5px/1.4 "JetBrains Mono",ui-monospace,monospace;color:var(--tc)}
.crow .ct{font-size:13px;line-height:1.4}
.crow .cc{font-size:11px;color:var(--dim);line-height:1.35;margin-top:2px;display:block}
@media(max-width:760px){.crow{grid-template-columns:40px 90px 1fr}.crow .tierchip{display:none}}
.axiomhero{border:1px solid rgba(217,169,74,.45);background:linear-gradient(180deg,rgba(43,36,19,.55),rgba(21,28,37,.4));border-radius:14px;padding:26px 30px;margin:14px 0 4px;text-align:center}
.axiomhero .ah-id{font:700 13px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--gold);letter-spacing:.22em}
.axiomhero h3{font-family:Cinzel,Georgia,serif;font-size:clamp(20px,2.8vw,27px);color:#e8d5a3;margin:10px 0 8px;letter-spacing:.05em}
.axiomhero p{color:var(--ink);font-size:14.5px;line-height:1.7;max-width:70ch;margin:0 auto 12px}
/* ============ questions ============ */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;margin-top:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--q);border-radius:10px;padding:14px 16px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.qcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--q)}
.qq{font-size:15.5px;font-weight:650;line-height:1.3}
.qmeta{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtype{font:600 9.5px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--q);background:var(--qbg);border:1px solid var(--q);border-radius:5px;padding:4px 7px}
.qn{font:500 10.5px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--dim)}
/* ============ worldviews ============ */
.wvtable{width:100%;border-collapse:collapse;margin-top:18px;font-size:12.5px}
.wvtable th,.wvtable td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center}
.wvtable th{font:700 9.5px/1.5 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.wvtable th a{color:var(--gold)}
.wvtable td.wvname{text-align:left;font-weight:650;font-size:13px;white-space:nowrap}
.wvtable td.wvverdict{text-align:left;font-size:11px;color:var(--mut);line-height:1.4;max-width:300px}
.cellp{color:var(--green);font-weight:700}
.cellf{color:var(--badl);font-weight:700}
.cellx{color:var(--orange);font-weight:700}
.celu{color:var(--dim)}
.wvnote{margin-top:14px;border:1px dashed var(--orange);border-radius:8px;background:var(--orangebg);padding:11px 14px;font-size:12px;color:var(--orange);line-height:1.55}
/* ============ burdens ============ */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));gap:11px;margin-top:16px}
.bcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px 16px}
.bcard h4{margin:0 0 6px;font-size:14px;color:var(--badl)}
.bcard p{margin:0 0 10px;font-size:12.5px;color:var(--mut);line-height:1.6}
.bstats{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--mut);line-height:1.8}
.bstats b{color:var(--ink)}
/* footer */
footer{max-width:1240px;margin:0 auto;padding:22px;color:var(--dim);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em}
@media(max-width:700px){#search{width:130px}.legend{display:none}.maphint{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.edge.anchoredge{stroke:var(--gold);stroke-opacity:.05;stroke-width:1}
body.strictview .edge.anchoredge{stroke-opacity:.16}
.edge.anchoredge.hot{stroke-opacity:.6;stroke:var(--gold)}
.edge.anchoredge.dead{stroke:var(--bad);stroke-opacity:.3}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
// =================== CSV / EXCEL UPLOAD ===================
(function(){
  const overlay = document.createElement('div');
  overlay.id = 'uploadOverlay';
  overlay.innerHTML = `
    <div id="uploadModal">
      <h2 style="font-family:Cinzel,serif;color:#e8d5a3;margin:0 0 8px">Upload Data</h2>
      <p style="color:var(--mut);font-size:13px;margin:0 0 16px;line-height:1.5">
        Drop a <b>.csv</b> or <b>.xlsx</b> file, or click to browse.<br>
        At minimum you need an <b>id</b> and <b>title</b> column. Dependencies can be comma-separated IDs.
      </p>
      <div id="dropZone">
        <div style="font-size:32px;margin-bottom:8px">&#128194;</div>
        <div>Drop file here or <span style="color:var(--accent);cursor:pointer;text-decoration:underline" id="browseLink">browse</span></div>
        <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.tsv" style="display:none">
      </div>
      <div id="mappingUI" style="display:none"></div>
      <div id="uploadStatus" style="margin-top:12px;font-size:12px;color:var(--mut)"></div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
        <button id="uploadCancel" class="ubtn">Cancel</button>
        <button id="uploadConfirm" class="ubtn primary" style="display:none">Load Data</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const sty = document.createElement('style');
  sty.textContent = `
    #uploadOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);
      backdrop-filter:blur(4px);align-items:center;justify-content:center}
    #uploadOverlay.on{display:flex}
    #uploadModal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;
      width:min(560px,92vw);max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
    #dropZone{border:2px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;
      color:var(--mut);font-size:13px;cursor:pointer;transition:border-color .2s,background .2s}
    #dropZone.over{border-color:var(--accent);background:rgba(73,180,224,.06)}
    #dropZone.done{border-color:var(--green);background:rgba(91,191,138,.06)}
    .ubtn{font:600 12px/1 Inter,sans-serif;padding:9px 18px;border-radius:7px;border:1px solid var(--line);
      background:var(--panel2);color:var(--ink);cursor:pointer}
    .ubtn:hover{border-color:var(--accent)}
    .ubtn.primary{background:var(--accent);color:#0e1218;border-color:var(--accent)}
    .ubtn.primary:hover{opacity:.85}
    .map-col{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;align-items:center;font-size:12px;margin-top:8px}
    .map-col label{color:var(--mut);text-align:right;font-weight:600}
    .map-col select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px}
  `;
  document.head.appendChild(sty);

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const browseLink = document.getElementById('browseLink');
  const uploadBtn = document.getElementById('uploadBtn');
  const cancelBtn = document.getElementById('uploadCancel');
  const confirmBtn = document.getElementById('uploadConfirm');
  const statusEl = document.getElementById('uploadStatus');
  const mappingUI = document.getElementById('mappingUI');
  let parsedRows = null, parsedCols = null;

  uploadBtn.onclick = () => overlay.classList.add('on');
  cancelBtn.onclick = () => { overlay.classList.remove('on'); reset(); };
  browseLink.onclick = (e) => { e.stopPropagation(); fileInput.click(); };
  dropZone.onclick = () => fileInput.click();
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if(fileInput.files[0]) handleFile(fileInput.files[0]); });

  function reset(){
    parsedRows = null; parsedCols = null;
    dropZone.classList.remove('done');
    confirmBtn.style.display = 'none';
    mappingUI.style.display = 'none'; mappingUI.innerHTML = '';
    statusEl.textContent = ''; statusEl.style.color = '';
  }

  function handleFile(file){
    const ext = file.name.split('.').pop().toLowerCase();
    statusEl.textContent = 'Reading ' + file.name + '...';
    statusEl.style.color = '';
    if(ext === 'csv' || ext === 'tsv'){
      const reader = new FileReader();
      reader.onload = (e) => onParsed(parseCSV(e.target.result, ext==='tsv'?'\t':','), file.name);
      reader.readAsText(file);
    } else if(ext === 'xlsx' || ext === 'xls'){
      const reader = new FileReader();
      reader.onload = (e) => {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        onParsed(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''}), file.name);
      };
      reader.readAsArrayBuffer(file);
    } else { statusEl.textContent = 'Unsupported format. Use .csv, .tsv, .xlsx, or .xls'; }
  }

  function parseCSV(text, sep){
    const lines = text.trim().split(/\r?\n/);
    if(lines.length < 2) return [];
    const headers = splitLine(lines[0], sep);
    return lines.slice(1).filter(l=>l.trim()).map(line => {
      const vals = splitLine(line, sep);
      const obj = {};
      headers.forEach((h,i) => obj[h.trim()] = (vals[i]||'').trim());
      return obj;
    });
  }
  function splitLine(line, sep){
    const r=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===sep&&!inQ){r.push(cur);cur='';}
      else cur+=c;
    }
    r.push(cur); return r;
  }

  function onParsed(rows, fname){
    if(!rows.length){ statusEl.textContent='No data rows found.'; return; }
    parsedRows = rows;
    parsedCols = Object.keys(rows[0]);
    dropZone.classList.add('done');
    statusEl.textContent = rows.length+' rows, '+parsedCols.length+' columns from '+fname;

    const fields = [
      {key:'id',label:'ID *',pat:['id','node_id','nodeid','key','code','identifier','axiom_id','axiom','#']},
      {key:'title',label:'Title *',pat:['title','name','label','t','heading','subject','topic']},
      {key:'description',label:'Description',pat:['description','desc','claim','c','text','content','body','summary','note','notes']},
      {key:'tier',label:'Tier / Category',pat:['tier','category','cat','type','group','class','level','cluster','ring','layer']},
      {key:'dependencies',label:'Dependencies',pat:['dependencies','deps','d','depends_on','parent','parents','depends','from','source','prerequisite','requires']},
      {key:'enables',label:'Enables',pat:['enables','e','children','leads_to','to','target','unlocks']},
      {key:'status',label:'Status',pat:['status','state','phase']},
      {key:'domain',label:'Domain / Tags',pat:['domain','domains','dom','tags','tag','area','field']},
    ];

    const colNorm = parsedCols.map(c=>c.toLowerCase().replace(/[\s_-]+/g,''));
    const mapping = {};
    fields.forEach(f => {
      const match = f.pat.find(p => colNorm.includes(p.replace(/[\s_-]+/g,'')));
      mapping[f.key] = match ? parsedCols[colNorm.indexOf(match.replace(/[\s_-]+/g,''))] : '';
    });

    mappingUI.style.display = 'block';
    mappingUI.innerHTML = '<div style="font:600 12px Inter;color:var(--ink);margin:12px 0 4px">Column Mapping</div><div class="map-col">' +
      fields.map(f => '<label>'+f.label+'</label><select data-field="'+f.key+'"><option value="">— skip —</option>' +
        parsedCols.map(c=>'<option value="'+c+'"'+(mapping[f.key]===c?' selected':'')+'>'+c+'</option>').join('') +
        '</select>').join('') + '</div>';
    confirmBtn.style.display = 'inline-block';
  }

  confirmBtn.onclick = () => {
    if(!parsedRows) return;
    const m = {};
    mappingUI.querySelectorAll('select').forEach(s => m[s.dataset.field]=s.value);
    if(!m.id||!m.title){ statusEl.textContent='ID and Title columns are required.'; statusEl.style.color='var(--bad)'; return; }

    // Collect tiers
    const tierSet = new Set();
    if(m.tier) parsedRows.forEach(r => { const v=String(r[m.tier]||'').trim(); if(v) tierSet.add(v); });
    const tiers = [...tierSet]; if(!tiers.length) tiers.push('DEFAULT');

    const palette = [
      {tc:'var(--gold)',tbg:'var(--goldbg)'},{tc:'var(--green)',tbg:'var(--greenbg)'},
      {tc:'var(--purple)',tbg:'var(--purplebg)'},{tc:'var(--orange)',tbg:'var(--orangebg)'},
      {tc:'var(--cyan)',tbg:'var(--cyanbg)'},{tc:'#e07070',tbg:'#2a1818'},
      {tc:'#70e0d0',tbg:'#122a28'},{tc:'#d0a0e0',tbg:'#251a2e'},
    ];

    // Build TIER_META
    const newTM = {};
    tiers.forEach((t,i) => {
      const key = t.replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase()||'DEFAULT';
      newTM[key] = {label:t.length>12?t.slice(0,12):t, ring:Math.min(i+1,5), desc:t};
    });
    if(!Object.keys(newTM).length) newTM['DEFAULT']={label:'NODE',ring:1,desc:'Default'};

    // Dynamic tier CSS
    let ds = document.getElementById('dynTierCSS');
    if(!ds){ds=document.createElement('style');ds.id='dynTierCSS';document.head.appendChild(ds);}
    ds.textContent = tiers.map((t,i)=>{
      const key=t.replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase();
      const p=palette[i%palette.length];
      return '.t-'+key+'{--tc:'+p.tc+';--tbg:'+p.tbg+'}';
    }).join(' ');

    function split(val){ return val?String(val).split(/[;,|]+/).map(s=>s.trim()).filter(Boolean):[]; }

    const newNodes = parsedRows.map((row,idx) => {
      const id = String(row[m.id]).trim();
      if(!id) return null;
      const rawTier = m.tier ? String(row[m.tier]||'DEFAULT').trim() : 'DEFAULT';
      const tier = rawTier.replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase()||'DEFAULT';
      if(!newTM[tier]) newTM[tier]={label:rawTier.slice(0,12),ring:Math.min(Object.keys(newTM).length+1,5),desc:rawTier};
      return {
        id, cp:idx+1, tier, cls:rawTier,
        status: m.status?String(row[m.status]||'').trim():'active',
        t: String(row[m.title]||'').trim(),
        c: m.description?String(row[m.description]||'').trim():'',
        d: m.dependencies?split(row[m.dependencies]):[],
        e: m.enables?split(row[m.enables]):[],
        dom: m.domain?split(row[m.domain]):[],
        def:'', anch:id+' ('+String(row[m.title]||'').trim()+')',
        ua:false, ct:{oc:0,cf:[],dfs:'',pro:'',xe:'',v:''}, src:'', k:'K0'
      };
    }).filter(Boolean);

    if(!newNodes.length){ statusEl.textContent='No valid rows.'; statusEl.style.color='var(--bad)'; return; }

    // Validate dependencies — remove refs to non-existent IDs
    const idSet = new Set(newNodes.map(n=>n.id));
    newNodes.forEach(n => { n.d = n.d.filter(x=>idSet.has(x)); n.e = n.e.filter(x=>idSet.has(x)); });

    NODES = newNodes;
    TIER_META = newTM;
    rebuildIndices();

    const searchEl = document.getElementById('search');
    if(searchEl) searchEl.placeholder = 'search '+NODES.length+' nodes ( / )';
    const foot = document.getElementById('foot');
    if(foot) foot.innerHTML = 'Uploaded dataset — '+NODES.length+' nodes, '+Object.keys(TIER_META).length+' tiers';

    MAP.sel=null; MAP.removed.clear(); MAP.zoom=1; MAP.cx=0; MAP.cy=0;
    overlay.classList.remove('on');
    reset();
    location.hash='#/map';
    route();
  };
})();

</script>
