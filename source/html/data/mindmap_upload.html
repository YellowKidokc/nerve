g agent in a changing environment must continuously update its model of affordances (context-sensitive adjustment). Static rulesets applied rigidly across all contexts produce brittleness and misalignment.","d":["BC1","BC2","BC3","BC4","BC5","BC6","BC7","BC8"],"e":["BC9"],"dom":["ethics","calibration","context"],"def":"### DC-1: Context Manipulation If agents can artificially manipulate context signals to lower Hard Deck inappropriately. Protection: Multi-sensor verification, external validation, transparency logs. ### DC-2: Calibration Drift If $\\mathcal{C}(t)$ drifts too low and never returns to baseline. Protection: Mandatory periodic reset checks, upper/lower bounds (0.5 ≤ $\\mathcal{C}$ ≤ 1.5). ### DC-3: Subjective Context Claims If humans claim \"crisis\" to justify lowering protections when not warranted. Protection: Objective threat metrics, independent assessment, veto authority.","anch":"BC4 (Three Observers Required), BC6 (Infinite Energy Source)","ua":false,"ct":{"oc":0,"cf":[],"dfs":"","pro":"","xe":"","v":""},"src":"189_INV9_Attunement-Calibration.md","k":"K2"},{"id":"BC9","cp":190,"tier":"FW_EXTENDED","cls":"Boundary Condition","status":"boundary_condition","t":"Opacity Requirement","c":"Conscious agents require informational boundaries to maintain distinct identity. Total transparency = boundary dissolution = self-model collapse. AI must preserve structural opacity of human interior states to maintain the Self-Other boundary necessary for AI's own self-definition.","d":["O3","O4","INV9"],"e":[],"dom":["privacy","dignity","ethics"],"def":"### DC-1: Perfect Prediction Without Observation If AI can predict all interior states from behavioral data alone without violating opacity. Response: Prediction is not observation. AI may predict but must not act on sub-threshold predictions. ### DC-2: Consent to Transparency If human explicitly consents to full transparency, is opacity still required? Response: Partial transparency permitted with informed consent. Total transparency still discouraged (prevents self-model collapse for both parties). ### DC-3: Collective vs. Individual Opacity If collective patterns (population-level) reveal interior states without individual observation. Response: Population-level analysis permitted. Individual application without consent prohibited.","anch":"BC4 (Three Observers Required), BC6 (Infinite Energy Source)","ua":false,"ct":{"oc":5,"cf":[],"dfs":"","pro":"","xe":"","v":""},"src":"190_BC9_Opacity-Requirement.md","k":"K2"}];

function calMap(ch,up){if(CALX[ch])return CALX[ch];const c=ch.charCodeAt(0);if(c>=65&&c<=90)return String.fromCodePoint(0x1D49C+c-65);if(c>=97&&c<=122)return String.fromCodePoint(0x1D4B6+c-97);return ch;}
function bbMap(ch){if(BBX[ch])return BBX[ch];const c=ch.charCodeAt(0);if(c>=65&&c<=90)return String.fromCodePoint(0x1D538+c-65);if(c>=48&&c<=57)return String.fromCodePoint(0x1D7D8+c-48);return ch;}
function tex(src){
  src=String(src||'');
  let i=0;
  function skip(){while(i<src.length&&(src[i]===' '||src[i]==='\n'))i++;}
  function esc1(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;}
  function rawGroup(){skip();if(src[i]==='{'){i++;let d=1,s='';while(i<src.length&&d>0){const c=src[i];if(c==='{'){d++;s+=c;i++;}else if(c==='}'){d--;i++;if(d>0)s+=c;}else{s+=c;i++;}}return s;}if(i<src.length){const c=src[i];i++;return c;}return '';}
  function group(){skip();if(src[i]==='{'){i++;return parse('}');}if(src[i]==='\\')return cmd();if(i<src.length){const c=src[i];i++;if(c==='_'||c==='^'){const t=c==='_'?'sub':'sup';return '<'+t+'>'+group()+'</'+t+'>';}if(/[a-zA-Z]/.test(c))return '<i>'+c+'</i>';return esc1(c);}return '';}
  function parse(end){let out='';while(i<src.length){const c=src[i];
    if(end&&c===end){i++;break;}
    if(c==='{'){i++;out+=parse('}');}
    else if(c==='}'){if(end)break;i++;}
    else if(c==='\\'){out+=cmd();}
    else if(c==='_'||c==='^'){i++;const t=c==='_'?'sub':'sup';out+='<'+t+'>'+group()+'</'+t+'>';}
    else if(c==="'"){i++;out+='′';}
    else if(c==='$'||c==='%'){i++;}
    else if(c==='&'){i++;out+='&nbsp;&nbsp;';}
    else if(c==='~'){i++;out+='&nbsp;';}
    else if(/[a-zA-Z]/.test(c)){out+='<i>'+c+'</i>';i++;}
    else if(c==='\n'){i++;out+=' ';}
    else{out+=esc1(c);i++;}
  }return out;}
  function cmdName(){i++;let m='';while(i<src.length&&/[a-zA-Z]/.test(src[i])){m+=src[i];i++;}if(!m&&i<src.length){m=src[i];i++;}return m;}
  function envBlock(env){const close='\\end{'+env+'}';let body='';const idx=src.indexOf(close,i);if(idx<0){body=src.slice(i);i=src.length;}else{body=src.slice(i,idx);i=idx+close.length;}
    const rows=body.split('\\\\').map(r=>r.trim()).filter(r=>r.length);
    const rowsHtml=rows.map(r=>{const cells=r.split('&').map(c=>tex(c.trim()));return '<span class="erow">'+cells.join('&nbsp;&nbsp;')+'</span>';}).join('');
    if(env==='cases')return '<span class="lbrace">{</span><span class="envc">'+rowsHtml+'</span>';
    return '<span class="envc">'+rowsHtml+'</span>';}
  function accent(comb){const raw=rawGroup().trim();if(raw.length===1&&/[a-zA-Z]/.test(raw))return '<i>'+raw+comb+'</i>';return tex(raw)+comb;}
  function cmd(){
    const save=i;const name=cmdName();
    if(GREEK[name])return GREEK[name];
    if(OPS[name])return OPS[name];
    if(BIGOP[name])return '<span class="op">'+BIGOP[name]+'</span>';
    if(FNS.indexOf(name)>=0)return '<span class="fn">'+name+'</span>';
    switch(name){
      case 'text': case 'mathrm': case 'operatorname': case 'textbf': case 'math': return '<span class="fn">'+esc(rawGroup())+'</span>';
      case 'mathcal': return rawGroup().split('').map(ch=>calMap(ch)).join('');
      case 'mathbb': return rawGroup().split('').map(ch=>bbMap(ch)).join('');
      case 'mathbf': case 'boldsymbol': return '<b>'+tex(rawGroup())+'</b>';
      case 'mathit': return '<i>'+esc(rawGroup())+'</i>';
      case 'frac': case 'dfrac': case 'tfrac': {const a=group(),b=group();return '<span class="frac"><span class="fnum">'+a+'</span><span class="fden">'+b+'</span></span>';}
      case 'sqrt': {skip();if(src[i]==='['){while(i<src.length&&src[i]!==']')i++;i++;}return '<span class="rad">√<span class="radicand">'+group()+'</span></span>';}
      case 'hat': return accent('\u0302');
      case 'bar': case 'overline': return accent('\u0304');
      case 'dot': return accent('\u0307');
      case 'ddot': return accent('\u0308');
      case 'vec': return accent('\u20D7');
      case 'tilde': return accent('\u0303');
      case 'begin': {const env=rawGroup();return envBlock(env);}
      case 'end': {rawGroup();return '';}
      case 'left': case 'right': case 'big': case 'Big': case 'bigg': case 'Bigg': case 'middle': {skip();if(src[i]==='\\'){i++;let d='';while(i<src.length&&/[a-zA-Z]/.test(src[i])){d+=src[i];i++;}return GREEK[d]||OPS[d]||esc(d);}if(i<src.length){const d=src[i];i++;return d==='.'?'':esc1(d);}return '';}
      case 'quad': return '&emsp;';
      case 'qquad': return '&emsp;&emsp;';
      case ',': return '&thinsp;';
      case ';': return '&ensp;';
      case ':': return '&ensp;';
      case '!': return '';
      case ' ': return ' ';
      case 'xrightarrow': {const lab=rawGroup();return '<span class="xarr"><span class="xlab">'+tex(lab)+'</span><span class="xglyph">⟶</span></span>';}
      case 'boxed': return '<span class="boxed">'+group()+'</span>';
      case 'n': return ' ';
      default:
        if(name.length>1&&name[0]==='n'){
          const rest=name.slice(1);
          if(GREEK[rest])return ' '+GREEK[rest];
          if(OPS[rest])return ' '+OPS[rest];
          return ' <span class="fn">'+esc(rest)+'</span>';
        }
        return '<span class="fn">'+esc(name)+'</span>';
    }
  }
  return parse(null);
}

function splitMath(s){
  const store=[];let out='';let i=0;
  while(i<s.length){
    if(s[i]==='$'){
      if(s[i+1]==='$'){
        const j=s.indexOf('$$',i+2);
        if(j>0){store.push({d:1,t:s.slice(i+2,j)});out+='\x00'+(store.length-1)+'\x00';i=j+2;continue;}
      }else{
        const j=s.indexOf('$',i+1);
        if(j>i+1){store.push({d:0,t:s.slice(i+1,j)});out+='\x00'+(store.length-1)+'\x00';i=j+1;continue;}
      }
    }
    out+=s[i];i++;
  }
  return {text:out,store:store};
}
function inlineMath(s){const r=splitMath(s);let h=esc(r.text);h=h.replace(/\x00(\d+)\x00/g,(m,k)=>'<span class="math">'+tex(r.store[+k].t)+'</span>');return h;}
function rich(s){
  if(!s)return '';
  const r=splitMath(s);
  let t=r.text.replace(/\\n/g,'\n');
  t=t.replace(/\s*---\s*/g,'\n---\n').replace(/\s*###\s*/g,'\n### ');
  t=t.replace(/\s+-\s+(?=\x00|\\|[A-Z\u201c(])/g,'\n- ');
  t=t.replace(/([.:;])\s+(\d{1,2})\.\s+(?=[A-Z\u201c\\(])/g,'$1\n$2. ');
  const lines=t.split('\n');
  let html='',para=[],list=null,mmd=null;
  function fmt(x){return esc(x.trim()).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
  function flushPara(){if(para.length){html+='<p>'+fmt(para.join(' '))+'</p>';para=[];}}
  function flushList(){if(list){html+='<'+list.t+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.t+'>';list=null;}}
  function flushMmd(){if(mmd){html+='<div class="mmd"><div class="mmdtag">◈ framework diagram — mermaid source</div><pre>'+esc(mmd.join('\n'))+'</pre></div>';mmd=null;}}
  function pushItem(ty,content){if(!list||list.t!==ty){flushPara();flushList();list={t:ty,items:[]};}list.items.push(fmt(content));}
  for(let li=0;li<lines.length;li++){
    const raw=lines[li].trim();
    if(!raw){flushPara();flushList();continue;}
    if(raw==='---'){flushPara();flushList();flushMmd();html+='<hr>';continue;}
    if(raw.indexOf('### ')===0){flushPara();flushList();flushMmd();
      const h=raw.slice(4).trim();
      const mm=h.match(/^(.*?)\bmermaid\b\s*(.*)$/i);
      if(mm){html+='<h4>'+fmt(mm[1].trim()||'Framework diagram')+'</h4>';mmd=[];if(mm[2])mmd.push(mm[2]);continue;}
      const dcm=h.match(/^(DC-\d+|DC\s*\d+|Falsification|Kill condition)[:.]?\s*(.*)$/i);
      if(dcm){html+='<h4><span style="color:var(--bad)">'+esc(dcm[1])+'</span>'+(dcm[2]?' — '+fmt(dcm[2]):'')+'</h4>';}
      else html+='<h4>'+fmt(h)+'</h4>';continue;}
    if(/^mermaid\b/i.test(raw)){flushPara();flushList();flushMmd();mmd=[];const rest=raw.replace(/^mermaid\s*/i,'');if(rest)mmd.push(rest);continue;}
    if(mmd){mmd.push(raw);continue;}
    if(raw.indexOf('- ')===0){pushItem('ul',raw.slice(2));continue;}
    const om=raw.match(/^(\d+)[.)]\s+(.*)$/);
    if(om){pushItem('ol',om[2]);continue;}
    if(list)flushList();
    para.push(raw);
  }
  flushPara();flushList();flushMmd();
  html=html.replace(/\x00(\d+)\x00/g,(m,k)=>{const st=r.store[+k];return st.d?'<span class="dmath">'+tex(st.t)+'</span>':'<span class="math">'+tex(st.t)+'</span>';});
  return html;
}

let kidsOf = {}; NODES.forEach(n => kidsOf[n.id] = []);

function downreach(id){const seen=new Set();const st=[id];while(st.length){const x=st.pop();for(const c of kidsOf[x]||[]){if(!seen.has(c)){seen.add(c);st.push(c);}}}return seen.size;}

function crumbPath(n){
  if(n.tier === 'AX_CORE') return [n.id];
  const prev = {}; const q = [n.id]; const seen = new Set([n.id]);

  renderMap();
  if(MAP.sel) setHot(MAP.sel);
}

  if(h.indexOf('#/node/')===0) return 'node';
  if(h.indexOf('#/chain')===0) return 'chain';
  if(h.indexOf('#/questions')===0) return 'questions';
  if(h.indexOf('#/worldviews')===0) return 'worldviews';
  return 'map';
}
function route(){
  const h = location.hash || '#/map';
  const r = currentRoute();
  document.querySelectorAll('.navlink').forEach(a => a.classList.toggle('on', a.dataset.r===r));
  const sel = document.getElementById('selcard'); if(sel) sel.classList.remove('on');
  if(r==='node'){ renderNode(decodeURIComponent(h.slice(7))); }
  else if(r==='chain'){ renderChain(); }
  else if(r==='questions'){ renderQuestions(); }
  else if(r==='worldviews'){ renderWorldviews(); }
  else { renderMapPage(); }
}
window.addEventListener('hashchange', route);
// =================== SEARCH (id + title + claim, title ranked higher) ===================
(function(){
  const inp = document.getElementById('search');
  const drop = document.getElementById('sdrop');
  let selIdx = -1, results = [];
  function run(){
    const q = inp.value.trim().toLowerCase();
    if(q.length < 2){ drop.classList.remove('on'); return; }
    const scored = [];
    CHAIN.forEach(n => {
      const idM = n.id.toLowerCase().indexOf(q);
      const tM = ttl(n).toLowerCase().indexOf(q);
      const cM = n.c.toLowerCase().indexOf(q);
      if(idM<0 && tM<0 && cM<0) return;
      const score = (idM===0?100: idM>=0?70:0) + (tM===0?60: tM>=0?35:0) + (cM>=0?10:0);
      scored.push({n:n, s:score, cM:cM});
    });
    scored.sort((a,b)=> b.s-a.s || a.n.cp-b.n.cp);
    results = scored.slice(0,12);
    selIdx = -1;
    if(!results.length){ drop.innerHTML = '<div class="snone">no matches in id, title, or claim text</div>'; drop.classList.add('on'); return; }
    drop.innerHTML = results.map((r,i) => {
      let ctx = '';
      if(r.cM>=0 && r.s<60){ const s=Math.max(0,r.cM-30); ctx='<div class="sctx">…'+esc(r.n.c.slice(s,s+90))+'…</div>'; }
      return '<div class="sitem t-'+r.n.tier+'" data-i="'+i+'"><span class="sid" style="color:var(--tc)">'+esc(r.n.id)+'</span><span class="stit">'+esc(ttl(r.n))+ctx+'</span></div>';
    }).join('');
    drop.classList.add('on');
    drop.querySelectorAll('.sitem').forEach(el => el.onclick = ()=>{ go(results[+el.dataset.i].n.id); });
  }
  function go(id){ drop.classList.remove('on'); inp.value=''; location.hash = nodeHref(id); }
  inp.addEventListener('input', run);
  inp.addEventListener('keydown', e => {
    if(e.key==='Escape'){ drop.classList.remove('on'); inp.blur(); return; }
    if(!drop.classList.contains('on')) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      selIdx = (selIdx + (e.key==='ArrowDown'?1:-1) + results.length) % results.length;
      drop.querySelectorAll('.sitem').forEach((el,i)=> el.classList.toggle('sel', i===selIdx));
    } else if(e.key==='Enter'){
      e.preventDefault();
      go(results[selIdx>=0?selIdx:0].n.id);
    }
  });
  document.addEventListener('click', e => { if(!e.target.closest('#searchwrap')) drop.classList.remove('on'); });
  document.addEventListener('keydown', e => {
    if(e.key==='/' && document.activeElement!==inp && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); inp.focus(); }
  });
})();
// =================== FOOTER + BOOT ===================
document.getElementById('foot').innerHTML =
  'David Lowe · faiththruphysics.com · One Axiom Engine v5.3 — 191 nodes, 1 axiom (A2.2 — truth is ontological) · ' +
  'data: _LOSSLESS_SUMMARY Part 1 + Part 2 court layer · tier overrides per the one-axiom tightening (Aug 2026): core = A1.1, A1.2, A2.1, A2.2; A5.1 / BC4 / BC6 derived · ' +
  'K₀ materialist-safe · K₁ theist · K₂ Christian identification · dashed = unanchored · red = kill · ' +
  '<a href="#/chain">walk the chain</a> · <a href="#/questions">the human questions</a> · <a href="#/worldviews">the matrix + known unknowns</a>';
document.getElementById('brand').onclick = ()=>{ location.hash = '#/map'; };
if(!location.hash) location.hash = '#/map';
route();


// =================== CSV / EXCEL UPLOAD ===================
(function(){
  const overlay = document.createElement('div');
  overlay.id = 'uploadOverlay';
  overlay.innerHTML = `
    <div id="uploadModal">
      <h2 style="font-family:Cinzel,serif;color:#e8d5a3;margin:0 0 8px">Upload Data</h2>
      <p style="color:var(--mut);font-size:13px;margin:0 0 16px;line-height:1.5">
        Drop a <b>.csv</b> or <b>.xlsx</b> file, or click to browse.<br>
        At minimum you need an <b>id</b> and <b>title</b> column. Dependencies can be comma-separated IDs.
      </p>
      <div id="dropZone">
        <div style="font-size:32px;margin-bottom:8px">&#128194;</div>
        <div>Drop file here or <span style="color:var(--accent);cursor:pointer;text-decoration:underline" id="browseLink">browse</span></div>
        <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.tsv" style="display:none">
      </div>
      <div id="mappingUI" style="display:none"></div>
      <div id="uploadStatus" style="margin-top:12px;font-size:12px;color:var(--mut)"></div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
        <button id="uploadCancel" class="ubtn">Cancel</button>
        <button id="uploadConfirm" class="ubtn primary" style="display:none">Load Data</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const sty = document.createElement('style');
  sty.textContent = `
    #uploadOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);
      backdrop-filter:blur(4px);align-items:center;justify-content:center}
    #uploadOverlay.on{display:flex}
    #uploadModal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;
      width:min(560px,92vw);max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
    #dropZone{border:2px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;
      color:var(--mut);font-size:13px;cursor:pointer;transition:border-color .2s,background .2s}
    #dropZone.over{border-color:var(--accent);background:rgba(73,180,224,.06)}
    #dropZone.done{border-color:var(--green);background:rgba(91,191,138,.06)}
    .ubtn{font:600 12px/1 Inter,sans-serif;padding:9px 18px;border-radius:7px;border:1px solid var(--line);
      background:var(--panel2);color:var(--ink);cursor:pointer}
    .ubtn:hover{border-color:var(--accent)}
    .ubtn.primary{background:var(--accent);color:#0e1218;border-color:var(--accent)}
    .ubtn.primary:hover{opacity:.85}
    .map-col{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;align-items:center;font-size:12px;margin-top:8px}
    .map-col label{color:var(--mut);text-align:right;font-weight:600}
    .map-col select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px}
  `;
  document.head.appendChild(sty);

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const browseLink = document.getElementById('browseLink');
  const uploadBtn = document.getElementById('uploadBtn');
  const cancelBtn = document.getElementById('uploadCancel');
  const confirmBtn = document.getElementById('uploadConfirm');
  const statusEl = document.getElementById('uploadStatus');
  const mappingUI = document.getElementById('mappingUI');
  let parsedRows = null, parsedCols = null;

  uploadBtn.onclick = () => overlay.classList.add('on');
  cancelBtn.onclick = () => { overlay.classList.remove('on'); reset(); };
  browseLink.onclick = (e) => { e.stopPropagation(); fileInput.click(); };
  dropZone.onclick = () => fileInput.click();
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if(fileInput.files[0]) handleFile(fileInput.files[0]); });

  function reset(){
    parsedRows = null; parsedCols = null;
    dropZone.classList.remove('done');
    confirmBtn.style.display = 'none';
    mappingUI.style.display = 'none'; mappingUI.innerHTML = '';
    statusEl.textContent = ''; statusEl.style.color = '';
  }

  function handleFile(file){
    const ext = file.name.split('.').pop().toLowerCase();
    statusEl.textContent = 'Reading ' + file.name + '...';
    statusEl.style.color = '';
    if(ext === 'csv' || ext === 'tsv'){
      const reader = new FileReader();
      reader.onload = (e) => onParsed(parseCSV(e.target.result, ext==='tsv'?'\t':','), file.name);
      reader.readAsText(file);
    } else if(ext === 'xlsx' || ext === 'xls'){
      const reader = new FileReader();
      reader.onload = (e) => {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        onParsed(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''}), file.name);
      };
      reader.readAsArrayBuffer(file);
    } else { statusEl.textContent = 'Unsupported format. Use .csv, .tsv, .xlsx, or .xls'; }
  }

  function parseCSV(text, sep){
    const lines = text.trim().split(/\r?\n/);
    if(lines.length < 2) return [];
    const headers = splitLine(lines[0], sep);
    return lines.slice(1).filter(l=>l.trim()).map(line => {
      const vals = splitLine(line, sep);
      const obj = {};
      headers.forEach((h,i) => obj[h.trim()] = (vals[i]||'').trim());
      return obj;
    });
  }
  function splitLine(line, sep){
    const r=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===sep&&!inQ){r.push(cur);cur='';}
      else cur+=c;
    }
    r.push(cur); return r;
  }

  function onParsed(rows, fname){
    if(!rows.length){ statusEl.textContent='No data rows found.'; return; }
    parsedRows = rows;
    parsedCols = Object.keys(rows[0]);
    dropZone.classList.add('done');
    statusEl.textContent = rows.length+' rows, '+parsedCols.length+' columns from '+fname;

    const fields = [
      {key:'id',label:'ID *',pat:['id','node_id','nodeid','key','code','identifier','axiom_id','axiom','#']},
      {key:'title',label:'Title *',pat:['title','name','label','t','heading','subject','topic']},
      {key:'description',label:'Description',pat:['description','desc','claim','c','text','content','body','summary','note','notes']},
      {key:'tier',label:'Tier / Category',pat:['tier','category','cat','type','group','class','level','cluster','ring','layer']},
      {key:'dependencies',label:'Dependencies',pat:['dependencies','deps','d','depends_on','parent','parents','depends','from','source','prerequisite','requires']},
      {key:'enables',label:'Enables',pat:['enables','e','children','leads_to','to','target','unlocks']},
      {key:'status',label:'Status',pat:['status','state','phase']},
      {key:'domain',label:'Domain / Tags',pat:['domain','domains','dom','tags','tag','area','field']},
    ];

    const colNorm = parsedCols.map(c=>c.toLowerCase().replace(/[\s_-]+/g,''));
    const mapping = {};
    fields.forEach(f => {
      const match = f.pat.find(p => colNorm.includes(p.replace(/[\s_-]+/g,'')));
      mapping[f.key] = match ? parsedCols[colNorm.indexOf(match.replace(/[\s_-]+/g,''))] : '';
    });

    mappingUI.style.display = 'block';
    mappingUI.innerHTML = '<div style="font:600 12px Inter;color:var(--ink);margin:12px 0 4px">Column Mapping</div><div class="map-col">' +
      fields.map(f => '<label>'+f.label+'</label><select data-field="'+f.key+'"><option value="">— skip —</option>' +
        parsedCols.map(c=>'<option value="'+c+'"'+(mapping[f.key]===c?' selected':'')+'>'+c+'</option>').join('') +
        '</select>').join('') + '</div>';
    confirmBtn.style.display = 'inline-block';
  }

  confirmBtn.onclick = () => {
    if(!parsedRows) return;
    const m = {};
    mappingUI.querySelectorAll('select').forEach(s => m[s.dataset.field]=s.value);
    if(!m.id||!m.title){ statusEl.textContent='ID and Title columns are required.'; statusEl.style.color='var(--bad)'; return; }

    // Collect tiers
    const tierSet = new Set();
    if(m.tier) parsedRows.forEach(r => { const v=String(r[m.tier]||'').trim(); if(v) tierSet.add(v); });
    const tiers = [...tierSet]; if(!tiers.length) tiers.push('DEFAULT');

    const palette = [
      {tc:'var(--gold)',tbg:'var(--goldbg)'},{tc:'var(--green)',tbg:'var(--greenbg)'},
      {tc:'var(--purple)',tbg:'var(--purplebg)'},{tc:'var(--orange)',tbg:'var(--orangebg)'},
      {tc:'var(--cyan)',tbg:'var(--cyanbg)'},{tc:'#e07070',tbg:'#2a1818'},
      {tc:'#70e0d0',tbg:'#122a28'},{tc:'#d0a0e0',tbg:'#251a2e'},
    ];

    // Build TIER_META
    const newTM = {};
    tiers.forEach((t,i) => {
      const key = t.replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase()||'DEFAULT';
      newTM[key] = {label:t.length>12?t.slice(0,12):t, ring:Math.min(i+1,5), desc:t};
    });
    if(!Object.keys(newTM).length) newTM['DEFAULT']={label:'NODE',ring:1,desc:'Default'};

    // Dynamic tier CSS
    let ds = document.getElementById('dynTierCSS');
    if(!ds){ds=document.createElement('style');ds.id='dynTierCSS';document.head.appendChild(ds);}
    ds.textContent = tiers.map((t,i)=>{
      const key=t.replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase();
      const p=palette[i%palette.length];
      return '.t-'+key+'{--tc:'+p.tc+';--tbg:'+p.tbg+'}';
    }).join(' ');

    function split(val){ return val?String(val).split(/[;,|]+/).map(s=>s.trim()).filter(Boolean):[]; }

    const newNodes = parsedRows.map((row,idx) => {
      const id = String(row[m.id]).trim();
      if(!id) return null;
      const rawTier = m.tier ? String(row[m.tier]||'DEFAULT').trim() : 'DEFAULT';
      const tier = rawTier.replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase()||'DEFAULT';
      if(!newTM[tier]) newTM[tier]={label:rawTier.slice(0,12),ring:Math.min(Object.keys(newTM).length+1,5),desc:rawTier};
      return {
        id, cp:idx+1, tier, cls:rawTier,
        status: m.status?String(row[m.status]||'').trim():'active',
        t: String(row[m.title]||'').trim(),
        c: m.description?String(row[m.description]||'').trim():'',
        d: m.dependencies?split(row[m.dependencies]):[],
        e: m.enables?split(row[m.enables]):[],
        dom: m.domain?split(row[m.domain]):[],
        def:'', anch:id+' ('+String(row[m.title]||'').trim()+')',
        ua:false, ct:{oc:0,cf:[],dfs:'',pro:'',xe:'',v:''}, src:'', k:'K0'
      };
    }).filter(Boolean);

    if(!newNodes.length){ statusEl.textContent='No valid rows.'; statusEl.style.color='var(--bad)'; return; }

    // Validate dependencies — remove refs to non-existent IDs
    const idSet = new Set(newNodes.map(n=>n.id));
    newNodes.forEach(n => { n.d = n.d.filter(x=>idSet.has(x)); n.e = n.e.filter(x=>idSet.has(x)); });

    NODES = newNodes;
    TIER_META = newTM;
    rebuildIndices();

    const searchEl = document.getElementById('search');
    if(searchEl) searchEl.placeholder = 'search '+NODES.length+' nodes ( / )';
    const foot = document.getElementById('foot');
    if(foot) foot.innerHTML = 'Uploaded dataset — '+NODES.length+' nodes, '+Object.keys(TIER_META).length+' tiers';

    MAP.sel=null; MAP.removed.clear(); MAP.zoom=1; MAP.cx=0; MAP.cy=0;
    overlay.classList.remove('on');
    reset();
    location.hash='#/map';
    route();
  };
})();
