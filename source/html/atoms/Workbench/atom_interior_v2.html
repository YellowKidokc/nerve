<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atom Interior v2 — Canonical Schema</title>
<style>
:root{--bg:#07090c;--s1:#0d1117;--s2:#121821;--s3:#18212c;--line:#26313d;--txt:#e8edf2;--muted:#8793a0;--gold:#d4af37;--golddim:#8a7129;--blue:#5b9bd5;--teal:#3bb39a;--red:#c94040;--purple:#a78bfa;--green:#7fc77f;--amber:#d7a94b;--void:#050505}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.55;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0d11}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
button{font:inherit;cursor:pointer}

/* ═══ IDENTITY BAND ═══ */
.idband{position:sticky;top:0;z-index:100;background:rgba(7,9,12,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 20px}
.idinner{max-width:1480px;margin:auto}
.idrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.iduuid{font:10px ui-monospace,Consolas,monospace;color:#5a5f66;letter-spacing:.05em}
.idcode{font:11px ui-monospace,Consolas,monospace;color:var(--golddim);background:var(--s2);padding:2px 8px;border-radius:4px;border:1px solid var(--line);letter-spacing:.08em}
.idlabel{font:700 20px Georgia,serif;color:var(--gold);letter-spacing:.03em}
.idtype{font:10px ui-monospace,Consolas,monospace;color:var(--blue);background:rgba(91,155,213,.1);border:1px solid rgba(91,155,213,.25);padding:2px 8px;border-radius:4px;letter-spacing:.1em;text-transform:uppercase}
.metarow{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.mpill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;background:var(--s2);border:1px solid var(--line);font:10px ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dg{background:var(--green)}.da{background:var(--amber)}.dr{background:var(--red)}.db{background:var(--blue)}

/* ═══ DOMAIN BANNER (top of atom, your request) ═══ */
.domainbanner{background:var(--void);border-bottom:1px solid var(--line);padding:10px 20px}
.domaininner{max-width:1480px;margin:auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.domlabel{font:9px ui-monospace,Consolas,monospace;color:var(--golddim);letter-spacing:.18em;text-transform:uppercase;flex-shrink:0}
.domgrid{display:flex;gap:6px;flex-wrap:wrap}
.domtile{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--s1);cursor:pointer;transition:all .15s}
.domtile:hover{border-color:var(--golddim);background:var(--s2)}
.domtile.home{border-color:var(--gold);background:rgba(212,175,55,.08)}
.domtile.native{border-color:var(--blue);background:rgba(91,155,213,.06)}
.domtile.bridge{border-color:var(--teal);background:rgba(59,179,154,.06)}
.domtile.candidate{border-color:var(--amber);border-style:dashed;background:rgba(215,169,75,.04)}
.domglyph{font-size:16px;width:20px;text-align:center}
.domname{font-size:11px;font-weight:600}.domrole{font:9px ui-monospace,Consolas,monospace;color:var(--muted);text-transform:uppercase}

/* ═══ 3-COLUMN LAYOUT ═══ */
.shell{max-width:1480px;margin:auto;padding:12px 20px 60px;display:grid;grid-template-columns:200px minmax(0,1fr) 220px;gap:12px}

/* ═══ LEFT RAIL ═══ */
.rail{display:flex;flex-direction:column;gap:8px}
.railcard{border:1px solid var(--line);border-radius:8px;background:var(--s1);padding:10px;font-size:11px}
.railhead{font:9px ui-monospace,Consolas,monospace;color:var(--golddim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.railrow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(38,49,61,.5)}
.railrow:last-child{border:0}
.railkey{color:var(--muted);font-size:10px}
.railval{font:10px ui-monospace,Consolas,monospace;color:var(--txt);text-align:right}

/* Five axes compact */
.axisbar{display:flex;flex-direction:column;gap:3px}
.axisrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--s2)}
.axisdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.axislabel{font:9px ui-monospace,Consolas,monospace;color:var(--muted);flex:1;text-transform:uppercase;letter-spacing:.04em}
.axisval{font:10px ui-monospace,Consolas,monospace;color:var(--txt);text-align:right;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══ CENTER PANEL ═══ */
.center{display:flex;flex-direction:column;gap:8px}

/* Atom card hero */
.atomhero{border:2px solid var(--blue);border-radius:14px;background:linear-gradient(145deg,#111923,#0c1117);padding:18px;position:relative;overflow:hidden}
.atomhero::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--purple),var(--blue),var(--teal),var(--gold))}
.herosym{font:52px Georgia,serif;color:white;text-align:center;margin:10px 0 4px}
.heroname{font:700 16px Georgia,serif;color:var(--gold);text-align:center}
.herosub{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
/* 15 markers around atom card */
.markers{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:12px}
.mkr{min-width:26px;height:20px;padding:0 4px;border:1px solid #495766;background:#202a35;color:#e8edf2;border-radius:4px;display:grid;place-items:center;font:700 8px ui-monospace,Consolas,monospace}
.mkr.dom{background:#153b54;border-color:#2d739b}.mkr.sem{background:#332d5a;border-color:#655a9c}.mkr.epi{background:#16463b;border-color:#287962}.mkr.warn{background:#553614;border-color:#9a6428}

/* Expandable blocks */
.block{border:1px solid var(--line);border-radius:9px;background:var(--s1);overflow:hidden}
.block.open{border-color:var(--golddim)}
.bhead{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;transition:background .15s}
.bhead:hover{background:var(--s2)}
.bicon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.btitle{font:700 13px Georgia,serif;color:var(--gold);flex:1;letter-spacing:.02em}
.bsummary{font-size:10px;color:var(--muted);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bchev{font-size:11px;color:#5a5f66;transition:transform .2s;flex-shrink:0}
.block.open .bchev{transform:rotate(90deg);color:var(--gold)}
.bbody{display:none;padding:10px 12px 12px;border-top:1px solid var(--line);background:rgba(5,5,5,.4)}
.block.open .bbody{display:block}

/* Inside blocks */
.fr{display:flex;gap:8px;margin-bottom:5px;align-items:baseline}
.fk{font:10px ui-monospace,Consolas,monospace;color:var(--golddim);letter-spacing:.08em;text-transform:uppercase;min-width:100px;flex-shrink:0}
.fv{font-size:12px;color:var(--txt)}
.fv.dim{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font:10px ui-monospace,Consolas,monospace;border:1px solid var(--line);background:var(--s2);margin:1px 2px}
.pill.bl{color:var(--blue);border-color:rgba(91,155,213,.3);background:rgba(91,155,213,.08)}
.pill.gr{color:var(--green);border-color:rgba(127,199,127,.3);background:rgba(127,199,127,.08)}
.pill.tl{color:var(--teal);border-color:rgba(59,179,154,.3);background:rgba(59,179,154,.08)}
.pill.pr{color:var(--purple);border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.08)}
.pill.am{color:var(--amber);border-color:rgba(215,169,75,.3);background:rgba(215,169,75,.08)}
.pill.rd{color:var(--red);border-color:rgba(201,64,64,.3);background:rgba(201,64,64,.08)}
.pill.gd{color:var(--gold);border-color:rgba(212,175,55,.3);background:rgba(212,175,55,.08)}
.eq{font:13px ui-monospace,Consolas,monospace;color:var(--green);background:#08120f;border:1px solid #1f4a3d;border-radius:7px;padding:12px;text-align:center;overflow:auto;white-space:pre-wrap;margin:6px 0}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;margin:5px 0}
.stepnum{width:22px;height:22px;border:1px solid #3d4b58;border-radius:50%;display:grid;place-items:center;font:10px ui-monospace,Consolas,monospace;color:var(--teal)}
.step p{margin:0;color:#b4bec8;font-size:12px}
.depnode{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--s2);margin-bottom:3px;cursor:pointer;transition:border-color .15s;font-size:11px}
.depnode:hover{border-color:var(--golddim)}
.depdir{font:9px ui-monospace,Consolas,monospace;color:#5a5f66;width:60px;flex-shrink:0;text-transform:uppercase}
.depid{font:10px ui-monospace,Consolas,monospace;color:var(--golddim)}
.kill{margin-top:6px;padding:8px 10px;background:rgba(201,64,64,.06);border:1px solid rgba(201,64,64,.25);border-radius:6px;font-size:12px;color:#dc8b8b}
.sub{margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.subh{font:9px ui-monospace,Consolas,monospace;color:var(--golddim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
.proof{padding:10px;background:#0c1218;border:1px solid #24313d;border-radius:7px;margin:4px 0}
.proof b{font-size:12px}.proof p{margin:3px 0 0;color:var(--muted);font-size:11px}
.grade-bar{display:flex;gap:2px;margin-top:4px}.grade-step{flex:1;height:6px;border-radius:3px;background:var(--s2);border:1px solid var(--line)}.grade-step.filled{background:var(--teal);border-color:var(--teal)}.grade-step.current{background:var(--gold);border-color:var(--gold);box-shadow:0 0 5px rgba(212,175,55,.4)}
.auditgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.acol{border:1px solid var(--line);border-radius:7px;padding:10px}.acol h4{font-size:11px;margin:0 0 6px}.acol ul{margin:0;padding-left:16px;color:#aab4bd;font-size:11px}.acol li{margin:5px 0}
.acol.ri h4{color:var(--green)}.acol.ov h4{color:var(--amber)}.acol.wr h4{color:var(--red)}

/* ═══ RIGHT RAIL ═══ */
.rcard{border:1px solid var(--line);border-radius:8px;background:var(--s1);padding:10px;font-size:11px;margin-bottom:8px}
.rhead{font:9px ui-monospace,Consolas,monospace;color:var(--golddim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.metric{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(38,49,61,.4);font-size:11px}
.metric:last-child{border:0}
.metric span:first-child{color:var(--muted)}
.metric span:last-child{font-family:ui-monospace,Consolas,monospace;color:var(--txt)}
.alertbox{border:1px solid rgba(201,64,64,.3);background:rgba(201,64,64,.04);border-radius:6px;padding:8px;margin-top:6px;font-size:11px;color:#dc8b8b}

@media(max-width:1100px){.shell{grid-template-columns:1fr}.rail{display:none}}
@media(max-width:800px){.auditgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<script>
