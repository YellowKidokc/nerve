<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POF 2828 - TTS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --surface2: #16161f;
      --border: #2b2b36; --text: #e5e7eb; --text-dim: #6b7280;
      --accent: #f59e0b; --accent-dim: #b45309; --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .header {
      padding: 12px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .header h1 { font-size: 16px; color: var(--accent); flex: 1; }
    .header .brand { font-size: 11px; color: var(--text-dim); }

    .main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    textarea {
      width: 100%; min-height: 140px; padding: 10px; resize: vertical;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 13px; line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--text-dim); }

    /* Collapsible sections */
    details {
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface);
    }
    details summary {
      padding: 10px 14px; cursor: pointer; font-size: 13px;
      font-weight: 500; color: var(--accent); user-select: none;
    }
    details summary:hover { color: var(--text); }
    details[open] summary { border-bottom: 1px solid var(--border); }
    .details-body { padding: 12px 14px; }

    /* Filter grid */
    .filter-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .filter-grid label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-dim); cursor: pointer;
      padding: 4px 0;
    }
    .filter-grid input[type="checkbox"] { accent-color: var(--accent); }

    /* Voice settings grid */
    .settings-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .field label {
      display: block; font-size: 11px; color: var(--text-dim);
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .field select, .field input[type="range"] {
      width: 100%; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 8px; font-family: inherit; font-size: 13px;
    }
    .field select:focus { outline: none; border-color: var(--accent); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .range-val {
      min-width: 32px; text-align: center; font-size: 12px;
      color: var(--accent); font-weight: 600;
    }

    /* Controls */
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 14px; border-radius: 6px; font-family: inherit;
      font-size: 13px; font-weight: 500; cursor: pointer;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); transition: all 0.15s;
    }
    button:hover { border-color: var(--text-dim); }
    button.primary {
      background: var(--accent); color: var(--bg);
      border-color: var(--accent); font-weight: 600;
    }
    button.primary:hover { background: #fbbf24; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.danger:hover { background: var(--danger); color: white; }

    /* History */
    .history-section { flex-shrink: 0; }
    .history-list {
      max-height: 160px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 4px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .history-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: var(--surface2);
      border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .history-item:hover { background: var(--border); }
    .history-item .text {
      flex: 1; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: var(--text-dim);
    }
    .history-item .replay {
      color: var(--accent); font-size: 14px; flex-shrink: 0;
    }
    .empty-history {
      text-align: center; padding: 16px; font-size: 12px; color: var(--text-dim);
    }
  </style>
</head>
<body>

<div class="header">
  <h1>TTS</h1>
  <span class="brand">POF 2828</span>
</div>

<div class="main">
  <textarea id="text" placeholder="Paste or type text to speak..."></textarea>

  <!-- Normalization Filters -->
  <details>
    <summary>Text Normalization Filters</summary>
    <div class="details-body">
      <div class="filter-grid">
        <label><input type="checkbox" id="f_urls" checked /> Strip URLs/links</label>
        <label><input type="checkbox" id="f_hashtags" checked /> Strip #hashtags</label>
        <label><input type="checkbox" id="f_mentions" checked /> Strip @mentions</label>
        <label><input type="checkbox" id="f_math" /> Strip math notation</label>
        <label><input type="checkbox" id="f_code" /> Strip code blocks</label>
        <label><input type="checkbox" id="f_emoji" /> Strip emoji/symbols</label>
        <label><input type="checkbox" id="f_markdown" /> Strip markdown syntax</label>
        <label><input type="checkbox" id="f_parens" /> Strip parentheticals</label>
      </div>
    </div>
  </details>

  <!-- Voice Settings -->
  <details open>
    <summary>Voice Settings</summary>
    <div class="details-body">
      <div class="settings-grid">
        <div class="field">
          <label>Engine</label>
          <select id="engine">
            <option value="sapi">SAPI (built-in)</option>
            <option value="edge">Edge TTS (online)</option>
          </select>
        </div>
        <div class="field">
          <label>Voice</label>
          <select id="voice">
            <option value="default">Loading...</option>
          </select>
        </div>
      </div>
      <div class="settings-grid" style="margin-top:10px">
        <div class="field">
          <label>Volume</label>
          <div class="range-row">
            <input id="volume" type="range" min="0" max="100" value="100" oninput="volVal.textContent=this.value" />
            <span class="range-val" id="volVal">100</span>
          </div>
        </div>
        <div class="field">
          <label>Speed</label>
          <div class="range-row">
            <input id="speed" type="range" min="-10" max="10" value="2" oninput="spdVal.textContent=this.value" />
            <span class="range-val" id="spdVal">2</span>
          </div>
        </div>
      </div>
      <div class="settings-grid" style="margin-top:10px">
        <div class="field">
          <label>Pitch</label>
          <div class="range-row">
            <input id="pitch" type="range" min="-10" max="10" value="0" oninput="pitchVal.textContent=this.value" />
            <span class="range-val" id="pitchVal">0</span>
          </div>
        </div>
      </div>
    </div>
  </details>

  <!-- Playback Controls -->
  <div class="controls">
    <button class="primary" id="btnSpeak">&#9654; Speak</button>
    <button id="btnPause">&#10074;&#10074; Pause</button>
    <button class="danger" id="btnStop">&#9632; Stop</button>
    <button id="btnDownload">&#11015; Download Audio</button>
  </div>

  <!-- History / Queue -->
  <details class="history-section">
    <summary>History (<span id="histCount">0</span>)</summary>
    <div class="details-body">
      <div class="history-list" id="historyList">
        <div class="empty-history">No recent items</div>
      </div>
    </div>
  </details>
</div>

<script>
  const post = (msg) => {
    try {
      window.chrome.webview.postMessage(JSON.stringify(msg));
      return true;
    } catch(e) { return false; }
  };

  // ── Text normalization filters ──────────────────────────────────
  const filters = {
    f_urls:     text => text.replace(/https?:\/\/\S+/g, ' '),
    f_hashtags: text => text.replace(/#[\w-]+/g, ' '),
    f_mentions: text => text.replace(/@[\w.-]+/g, ' '),
    f_code:     text => text.replace(/```[\s\S]*?```/g, ' ').replace(/`[^`]+`/g, ' '),
    f_math:     text => text.replace(/\$\$[\s\S]*?\$\$/g, ' ').replace(/\$[^$]+\$/g, ' ').replace(/[=+\-*/^<>~]{2,}/g, ' '),
    f_emoji:    text => text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, ' '),
    f_markdown: text => text.replace(/[*_~]{1,3}/g, '').replace(/^#{1,6}\s/gm, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'),
    f_parens:   text => text.replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' '),
  };

  function normalizeText(raw) {
    let t = raw;
    for (const [id, fn] of Object.entries(filters)) {
      const el = document.getElementById(id);
      if (el && el.checked) t = fn(t);
    }
    return t.replace(/\s+/g, ' ').trim();
  }

  // ── History ─────────────────────────────────────────────────────
  let history = [];
  const MAX_HISTORY = 20;

  function addToHistory(text) {
    const preview = text.length > 80 ? text.slice(0, 80) + '...' : text;
    history.unshift({ text, preview, time: new Date().toLocaleTimeString() });
    if (history.length > MAX_HISTORY) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    document.getElementById('histCount').textContent = history.length;
    if (!history.length) {
      el.innerHTML = '<div class="empty-history">No recent items</div>';
      return;
    }
    el.innerHTML = history.map((h, i) => `
      <div class="history-item" onclick="replayHistory(${i})">
        <span class="text">${escHtml(h.preview)}</span>
        <span style="color:var(--text-dim);font-size:10px">${h.time}</span>
        <span class="replay">&#9654;</span>
      </div>
    `).join('');
  }

  function replayHistory(idx) {
    const item = history[idx];
    if (item) {
      document.getElementById('text').value = item.text;
      doSpeak();
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Speak / controls ───────────────────────────────────────────
  function getSettings() {
    return {
      engine: engine.value,
      voice: voice.value,
      speed: Number(speed.value),
      volume: Number(volume.value),
      pitch: Number(pitch.value),
    };
  }

  function doSpeak() {
    const raw = document.getElementById('text').value;
    if (!raw.trim()) return;
    const normalized = normalizeText(raw);
    if (!normalized) return;
    const s = getSettings();
    post({ type: 'speak_text', text: normalized, engine: s.engine, voice: s.voice, speed: s.speed, volume: s.volume });
    addToHistory(raw);
  }

  btnSpeak.onclick = doSpeak;
  btnPause.onclick = () => post({ type: 'tts_pause' });
  btnStop.onclick = () => post({ type: 'tts_stop' });
  btnDownload.onclick = () => {
    const raw = document.getElementById('text').value;
    if (!raw.trim()) return;
    const normalized = normalizeText(raw);
    const s = getSettings();
    post({ type: 'tts_download', text: normalized, engine: s.engine, voice: s.voice, speed: s.speed, volume: s.volume });
  };

  // ── IPC message handler ────────────────────────────────────────
  window.addEventListener('message', (event) => {
    const raw = event.data;
    let msg;
    try { msg = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { return; }

    if (msg.type === 'voices') {
      voice.innerHTML = '';
      (msg.voices || []).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v.replace('Microsoft ', '');
        voice.appendChild(opt);
      });
    }
    if (msg.type === 'config' && msg.config?.tts) {
      engine.value = msg.config.tts.engine || 'sapi';
      volume.value = msg.config.tts.volume ?? 100;
      speed.value = msg.config.tts.speed ?? 2;
      volVal.textContent = volume.value;
      spdVal.textContent = speed.value;
      // Select matching voice after voices load
      setTimeout(() => {
        const target = msg.config.tts.voice || '';
        for (const opt of voice.options) {
          if (opt.value === target || opt.value.includes(target)) {
            voice.value = opt.value;
            break;
          }
        }
      }, 200);
    }
  });

  // ── Init ───────────────────────────────────────────────────────
  post({ type: 'get_config' });
  post({ type: 'list_voices' });
</script>
</body>
</html>
