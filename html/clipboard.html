<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipSync</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#0a0a0f}
  ::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:3px}
  body{font-family:'IBM Plex Mono',monospace;background:#0a0a0f;color:#c8ccd4;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
  .header{padding:10px 16px 8px;border-bottom:1px solid #1e1e2e;background:#0d0d14;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.brand{display:flex;align-items:center;gap:8px}.brand-tag{font-size:10px;letter-spacing:3px;color:#f59e0b;font-weight:700}.brand-sep{font-size:11px;color:#2a2a3a}.brand-sub{font-size:10px;letter-spacing:2px;color:#444}.header-right{display:flex;align-items:center;gap:6px}.status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 6px rgba(16,185,129,0.5);animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}.status-text{font-size:9px;letter-spacing:1px;color:#444}.pin-btn{background:transparent;border:1px solid #1e1e2e;color:#3a3a4a;padding:3px 8px;border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s;line-height:1}.pin-btn:hover{border-color:#555;color:#555}.pin-btn.pinned{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4);color:#f59e0b}.pin-btn.locked{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:#10b981}.tab-bar{display:flex;background:#0a0a0f;border-bottom:1px solid #1e1e2e;flex-shrink:0}.tab{flex:1;padding:7px 0;text-align:center;font-size:9px;letter-spacing:2px;font-weight:600;color:#3a3a4a;cursor:pointer;border-bottom:2px solid transparent;transition:all .1s}.tab:hover{color:#666}.tab.active{color:#f59e0b;border-bottom-color:#f59e0b}.tab .tab-count{font-size:8px;color:#2a2a3a;margin-left:4px}.tab.active .tab-count{color:rgba(245,158,11,.5)}.panel{display:none;flex:1;flex-direction:column;overflow:hidden}.panel.active{display:flex}.search-wrap{padding:8px 12px;flex-shrink:0;position:relative}.search-wrap svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#3a3a4a;pointer-events:none}.search-input{width:100%;background:#12121c;border:1px solid #1e1e2e;border-radius:5px;padding:8px 12px 8px 32px;color:#c8ccd4;font-size:12px;font-family:inherit;outline:none}.search-input:focus{border-color:rgba(245,158,11,.25)}.search-input::placeholder{color:#2a2a3a}.slot-bar{display:flex;gap:3px;padding:4px 12px 6px;flex-shrink:0;border-bottom:1px solid #1e1e2e}.slot{flex:1;height:26px;display:flex;align-items:center;justify-content:center;background:#12121c;border:1px solid #1a1a2a;border-radius:3px;color:#2a2a3a;font-size:10px;font-weight:600;cursor:pointer;transition:all .1s}.slot:hover{border-color:rgba(245,158,11,.25);color:#f59e0b}.slot.filled{color:#555;background:#14142a}.clip-list{flex:1;overflow-y:auto;padding:4px 8px}.clip-item{padding:8px 12px;margin-bottom:2px;background:transparent;border:1px solid transparent;border-left:2px solid transparent;border-radius:3px;cursor:pointer;transition:all .08s;position:relative}.clip-item:hover{background:#0f0f1a;border-color:#13131d}.clip-item.pinned{border-left-color:#fbbf24}.clip-content{font-size:12px;line-height:1.5;color:#9ca3af;white-space:pre-wrap;word-break:break-word;max-height:80px;overflow:hidden;mask-image:linear-gradient(to bottom,#000 60%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent)}.clip-meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.clip-time{font-size:9px;color:#2a2a3a}.clip-tags{display:flex;gap:3px}.tag{padding:0 6px;font-size:8px;font-weight:600;letter-spacing:1px;background:#15151f;border-radius:2px;color:#3a3a4a}.clip-actions{position:absolute;top:6px;right:8px;display:none;gap:3px}.clip-item:hover .clip-actions{display:flex}.clip-actions button{background:#12121c;border:1px solid #1e1e2e;border-radius:3px;color:#555;padding:2px 7px;font-size:9px;font-family:inherit;cursor:pointer;letter-spacing:.5px;transition:all .1s}.clip-actions button:hover{color:#f59e0b;border-color:rgba(245,158,11,.25)}.clip-actions .del-btn:hover{color:#ef4444;border-color:rgba(239,68,68,.25)}.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#2a2a3a;gap:4px}.empty-state div:first-child{font-size:11px;letter-spacing:2px}.tts-bar{padding:8px 12px;border-top:1px solid #1e1e2e;background:#0d0d14;flex-shrink:0}.tts-row{display:flex;gap:4px;align-items:center}.tts-input{flex:1;background:#0a0a0f;border:1px solid #1e1e2e;border-radius:4px;padding:6px 8px;color:#c8ccd4;font-size:11px;font-family:inherit;outline:none;resize:none;height:32px;line-height:1.4}.tts-input:focus{border-color:rgba(245,158,11,.25)}.tts-input::placeholder{color:#2a2a3a}.tts-btn{padding:6px 10px;border:1px solid #1e1e2e;border-radius:4px;background:transparent;color:#555;font-size:9px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:1px;transition:all .1s;white-space:nowrap}.tts-btn:hover{border-color:rgba(245,158,11,.25);color:#f59e0b}.tts-btn.speak{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#10b981}.tts-btn.speak:hover{background:rgba(16,185,129,.15)}.tts-btn.stop{color:#ef4444}.tts-btn.stop:hover{border-color:rgba(239,68,68,.25)}.tts-btn.auto-on{color:#10b981;border-color:rgba(16,185,129,.3)}.footer{padding:4px 14px;border-top:1px solid #1e1e2e;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#2a2a3a;background:#0a0a0f;flex-shrink:0}.kbd{color:#555;border:1px solid #1e1e2e;padding:0 4px;border-radius:2px;font-size:8px;margin-right:2px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#10b981;color:#000;padding:10px 24px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:2px;z-index:9999;pointer-events:none;animation:toastPop .3s ease}@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<div class="header"><div class="brand"><span class="brand-tag">POF 2828</span><span class="brand-sep">│</span><span class="brand-sub">CLIPSYNC</span></div><div class="header-right"><span class="status-dot"></span><span class="status-text">ACTIVE</span><button class="pin-btn" id="pinBtn" onclick="cyclePin()" title="Pin: Off > On Top > Always Open">📌</button></div></div>
<div class="tab-bar"><div class="tab active" onclick="switchTab('clips')">CLIPS <span class="tab-count" id="clipCount">0</span></div><div class="tab" onclick="switchTab('tts')">TTS</div></div>
<div class="panel active" id="panel-clips"><div class="search-wrap"><input type="text" class="search-input" id="clipSearch" placeholder="Search clips..."><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="slot-bar" id="slotBar"></div><div class="clip-list" id="clipList"></div></div>
<div class="panel" id="panel-tts"><div style="padding:12px 14px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px"><div style="font-size:9px;font-weight:700;letter-spacing:2px;color:#f59e0b;padding-bottom:4px;border-bottom:1px solid #1e1e2e">TEXT-TO-SPEECH</div><div style="display:flex;gap:6px;flex-direction:column"><label style="font-size:8px;letter-spacing:1.5px;color:#555;text-transform:uppercase;font-weight:600">Engine</label><select id="ttsEngine" onchange="onEngineChange()" style="width:100%;padding:6px 8px;background:#0a0a0f;border:1px solid #1e1e2e;border-radius:4px;color:#c8ccd4;font-size:12px;font-family:inherit;outline:none"><option value="sapi">Windows SAPI</option><option value="edge">Edge TTS (online)</option></select></div><div style="display:flex;gap:6px;flex-direction:column"><label style="font-size:8px;letter-spacing:1.5px;color:#555;text-transform:uppercase;font-weight:600">Voice</label><div style="display:flex;gap:4px;align-items:center"><select id="ttsVoice" style="flex:1;padding:6px 8px;background:#0a0a0f;border:1px solid #1e1e2e;border-radius:4px;color:#c8ccd4;font-size:12px;font-family:inherit;outline:none"><option value="default">Default</option></select><button onclick="refreshVoices()" title="Refresh" style="background:transparent;border:1px solid #1e1e2e;border-radius:4px;color:#555;padding:5px 7px;cursor:pointer;font-size:12px;line-height:1">🔄</button><button onclick="downloadVoices()" title="Download" style="background:transparent;border:1px solid #1e1e2e;border-radius:4px;color:#555;padding:5px 7px;cursor:pointer;font-size:12px;line-height:1">⬇️</button></div></div><div style="display:flex;gap:6px;flex-direction:column"><label style="font-size:8px;letter-spacing:1.5px;color:#555;text-transform:uppercase;font-weight:600">Speed <span style="color:#f59e0b" id="speedVal">2</span></label><input type="range" id="ttsSpeed" min="-10" max="10" step="1" value="2" oninput="document.getElementById('speedVal').textContent=this.value" style="width:100%;-webkit-appearance:none;height:3px;background:#1e1e2e;border-radius:2px;outline:none"></div><div style="display:flex;gap:6px;flex-direction:column"><label style="font-size:8px;letter-spacing:1.5px;color:#555;text-transform:uppercase;font-weight:600">Volume <span style="color:#f59e0b" id="volVal">100</span></label><input type="range" id="ttsVolume" min="0" max="100" step="5" value="100" oninput="document.getElementById('volVal').textContent=this.value" style="width:100%;-webkit-appearance:none;height:3px;background:#1e1e2e;border-radius:2px;outline:none"></div><div style="display:flex;gap:6px;flex-direction:column"><label style="font-size:8px;letter-spacing:1.5px;color:#555;text-transform:uppercase;font-weight:600">Speak Text</label><textarea id="ttsText" placeholder="Paste or type text here..." style="width:100%;min-height:80px;padding:8px;background:#0a0a0f;border:1px solid #1e1e2e;border-radius:4px;color:#c8ccd4;font-size:11px;font-family:inherit;outline:none;resize:vertical;line-height:1.5"></textarea><div style="display:flex;gap:4px"><button class="tts-btn speak" onclick="speakText()">▶ SPEAK</button><button class="tts-btn stop" onclick="stopTts()">■ STOP</button><button class="tts-btn" onclick="clearTtsText()">CLEAR</button><button class="tts-btn" id="autoTtsBtn" onclick="toggleAutoTts()">AUTO: OFF</button></div></div></div></div>
<div class="tts-bar" id="ttsQuickBar"><div class="tts-row"><textarea class="tts-input" id="ttsQuickInput" placeholder="Paste text, hit Speak..." rows="1"></textarea><button class="tts-btn speak" onclick="quickSpeak()">▶</button><button class="tts-btn stop" onclick="stopTts()">■</button></div></div>
<div class="footer"><span id="footerCount">0 clips</span><span><span class="kbd">Ctrl+Shift+1-0</span> paste slots</span></div>
<script>
var clips=[],searchTerm='',config={},pinState=0,autoTts=false,autoTtsArmed=false;
function ipc(msg){try{window.chrome.webview.postMessage(JSON.stringify(msg));return true}catch(e){return false}}
function switchTab(name){document.querySelectorAll('.tab').forEach(function(t,i){var p=['clips','tts'];var a=p[i]===name;t.classList.toggle('active',a);document.getElementById('panel-'+p[i]).classList.toggle('active',a)});document.getElementById('ttsQuickBar').style.display=name==='clips'?'block':'none'}
function cyclePin(){pinState=(pinState+1)%3;var b=document.getElementById('pinBtn');b.className='pin-btn';if(pinState===1){b.classList.add('pinned');b.title='Pinned: On Top';ipc({type:'set_always_on_top',value:true})}else if(pinState===2){b.classList.add('locked');b.title='Locked: Always Open';ipc({type:'set_always_on_top',value:true});ipc({type:'set_always_open',value:true})}else{b.title='Pin: Off';ipc({type:'set_always_on_top',value:false});ipc({type:'set_always_open',value:false})}}
function renderSlots(){var bar=document.getElementById('slotBar');bar.innerHTML='';for(var i=0;i<10;i++){var s=document.createElement('div');s.className='slot'+(clips.length>i?' filled':'');s.textContent=(i+1)%10;s.title=clips[i]?clips[i].content.substring(0,60):'Empty';s.onclick=(function(j){return function(){pasteSlot(j)}})(i);bar.appendChild(s)}}
function renderClips(){var list=document.getElementById('clipList');var q=searchTerm.toLowerCase();var f=clips.filter(function(c){return !q||c.content.toLowerCase().indexOf(q)!==-1});if(f.length===0){list.innerHTML='<div class="empty-state"><div>NO CLIPS YET</div><div>copy something to get started</div></div>'}else{list.innerHTML=f.map(function(clip,i){return'<div class="clip-item '+(clip.pinned?'pinned':'')+'" onclick="copyClip('+i+')"><div class="clip-content">'+esc(clip.content)+'</div><div class="clip-meta"><span class="clip-time">'+(clip.timestamp||'just now')+'</span><div class="clip-tags">'+(clip.tags||[]).map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div></div><div class="clip-actions"><button onclick="event.stopPropagation();pinClip('+i+')">'+(clip.pinned?'UNPIN':'PIN')+'</button><button class="del-btn" onclick="event.stopPropagation();deleteClip('+i+')">DEL</button></div></div>'}).join('')}document.getElementById('clipCount').textContent=clips.length;document.getElementById('footerCount').textContent=f.length+' clips'}
function copyClip(i){if(clips[i]){navigator.clipboard.writeText(clips[i].content);showToast('COPIED')}}
function pasteSlot(i){if(clips[i]){navigator.clipboard.writeText(clips[i].content);showToast('SLOT '+((i+1)%10))}}
function pinClip(i){clips[i].pinned=!clips[i].pinned;renderClips()}
function deleteClip(i){clips.splice(i,1);renderClips();renderSlots()}
function speakText(){var text=document.getElementById('ttsText').value.trim();if(!text)return;saveTtsConfig();if(ipc({type:'speak_text',text:text})){showToast('SPEAKING')}else{try{var u=new SpeechSynthesisUtterance(text);speechSynthesis.speak(u);showToast('SPEAKING')}catch(e){showToast('TTS FAILED')}}if(autoTts&&!autoTtsArmed){autoTtsArmed=true}}
function quickSpeak(){var text=document.getElementById('ttsQuickInput').value.trim();if(!text)return;if(ipc({type:'speak_text',text:text})){showToast('SPEAKING')}else{try{var u=new SpeechSynthesisUtterance(text);speechSynthesis.speak(u);showToast('SPEAKING')}catch(e){showToast('TTS FAILED')}}}
function stopTts(){ipc({type:'tts_stop'});try{speechSynthesis.cancel()}catch(e){}}
function clearTtsText(){document.getElementById('ttsText').value='';autoTtsArmed=false}
function toggleAutoTts(){autoTts=!autoTts;var btn=document.getElementById('autoTtsBtn');btn.textContent='AUTO: '+(autoTts?'ON':'OFF');btn.className='tts-btn'+(autoTts?' auto-on':'')}
function refreshVoices(){if(ipc({type:'list_voices'})){showToast('REFRESHING')}else{showToast('NO AGENT')}}
function downloadVoices(){if(ipc({type:'open_url',url:'ms-settings:speech'})){showToast('OPENING')}else{try{window.open('ms-settings:speech')}catch(e){}showToast('OPEN SETTINGS')}}
function populateVoices(voices){var sel=document.getElementById('ttsVoice');var cur=config.tts?config.tts.voice:'default';sel.innerHTML='<option value="default">Default (auto)</option>';voices.forEach(function(v){var opt=document.createElement('option');opt.value=v;opt.textContent=v.replace('Microsoft ','');sel.appendChild(opt)});for(var j=0;j<sel.options.length;j++){if(sel.options[j].value===cur||sel.options[j].value.indexOf(cur)!==-1){sel.value=sel.options[j].value;break}}}
function saveTtsConfig(){config.tts=config.tts||{};config.tts.engine=document.getElementById('ttsEngine').value;config.tts.voice=document.getElementById('ttsVoice').value;config.tts.speed=parseInt(document.getElementById('ttsSpeed').value);config.tts.volume=parseInt(document.getElementById('ttsVolume').value)}
function onEngineChange(){ipc({type:'list_voices'})}
function setupAutoTts(){var lastClip='';setInterval(function(){if(!autoTts||!autoTtsArmed)return;navigator.clipboard.readText().then(function(text){if(text&&text!==lastClip&&text.trim().length>0){lastClip=text;document.getElementById('ttsText').value=text;document.getElementById('ttsQuickInput').value=text;speakText()}}).catch(function(){})},800)}
function populateUI(){if(config.tts){document.getElementById('ttsEngine').value=config.tts.engine||'sapi';document.getElementById('ttsSpeed').value=config.tts.speed!=null?config.tts.speed:2;document.getElementById('ttsVolume').value=config.tts.volume!=null?config.tts.volume:100;document.getElementById('speedVal').textContent=config.tts.speed!=null?config.tts.speed:2;document.getElementById('volVal').textContent=config.tts.volume!=null?config.tts.volume:100}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showToast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},600)}
document.getElementById('clipSearch').addEventListener('input',function(e){searchTerm=e.target.value;renderClips()});
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='f'){e.preventDefault();document.getElementById('clipSearch').focus()}});
function requestClips(){if(!ipc({type:'get_clips'})){clips=[{content:'ClipSync is running. Copy something to get started.',timestamp:'just now',tags:['system'],pinned:false}];renderSlots();renderClips()}}
function loadConfig(){if(!ipc({type:'get_config'})){config={clipboard_interval_ms:500,sync_interval_secs:300,api_url:'',api_token:'',tts:{engine:'sapi',voice:'Brian',speed:2,volume:100}};populateUI()}ipc({type:'list_voices'})}
setInterval(function(){try{ipc({type:'get_clips'})}catch(e){}},2000);
loadConfig();requestClips();setupAutoTts();
</script>
</body>
</html>
