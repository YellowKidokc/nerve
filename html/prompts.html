<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Prompts</title>
<style>
  body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#0f0f0f;color:#e0e0e0;padding:14px}
  h1{margin:0 0 8px;font-size:20px;color:#60d0ff}
  .count{color:#9aa0a6;font-size:12px;margin-bottom:10px}
  .prompt{padding:10px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;margin-bottom:8px;cursor:pointer}
  .name{font-size:14px;font-weight:600;color:#dbeafe}
  .body{font-size:13px;color:#bbb;margin-top:4px;white-space:pre-wrap}
</style>
</head>
<body>
  <h1>Prompts</h1>
  <div class="count" id="count">Loading…</div>
  <div id="list"></div>
<script>
let prompts = [];
function render() {
  const list = document.getElementById('list');
  document.getElementById('count').textContent = `${prompts.length} prompts`;
  list.innerHTML = prompts.map((p, i) => `
    <div class="prompt" onclick="copyPrompt(${i})">
      <div class="name">${escapeHtml(p.name || 'Untitled')}</div>
      <div class="body">${escapeHtml((p.template || '').slice(0, 220))}</div>
    </div>
  `).join('');
}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML;}
function copyPrompt(i){
  if (!prompts[i]) return;
  navigator.clipboard.writeText(prompts[i].template || '');
}
try {
  window.chrome.webview.addEventListener('message', (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'config') {
      prompts = data.config.prompts || [];
      render();
    }
  });
  window.chrome.webview.postMessage(JSON.stringify({ type: 'get_config' }));
} catch(e) {
  document.getElementById('count').textContent = 'Standalone mode';
}
</script>
</body>
</html>
