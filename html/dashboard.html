<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Axiom Chain — Horizontal Mind Map</title>
<style>
  :root {
    --bg: #070b12;
    --surface: #111826;
    --surface2: #162134;
    --text: #e6edf3;
    --muted: #9ca9b8;
    --science: #4ea1ff;
    --god: #d4a73b;
    --bridge: #8ab4ff;
    --danger: #ff6b6b;
    --good: #4ad295;
    --border: #27344b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #05070d 0%, #090f1b 100%);
    overflow-y: hidden;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(8, 12, 20, 0.95);
    backdrop-filter: blur(4px);
  }
  .title h1 { margin: 0; font-size: 19px; }
  .title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .scores { display: flex; gap: 10px; }
  .score {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    min-width: 175px;
    font-size: 12px;
  }
  .score strong { display: block; font-size: 13px; margin-bottom: 4px; }

  .board {
    height: calc(100vh - 78px);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 12px 16px 22px;
    scroll-behavior: smooth;
  }
  .board-inner {
    width: max-content;
    min-width: 100%;
    display: grid;
    gap: 18px;
  }
  .chain {
    background: rgba(12, 17, 28, 0.72);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    display: grid;
    gap: 8px;
  }
  .chain-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    padding: 0 2px;
  }
  .cards {
    display: flex;
    align-items: stretch;
    gap: 30px;
    width: max-content;
    padding: 2px;
  }
  .card-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .card-wrap::after {
    content: "→";
    position: absolute;
    right: -21px;
    color: #6f8cb0;
    font-size: 18px;
    opacity: .9;
  }
  .card-wrap:last-child::after { display: none; }

  .axiom-card {
    width: 305px;
    min-height: 205px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 10px 10px 11px;
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .axiom-card:hover {
    transform: translateY(-2px);
    border-color: #4b678d;
    box-shadow: 0 8px 20px rgba(15, 24, 38, 0.55);
  }
  .meta { display:flex; justify-content:space-between; align-items:center; color: var(--muted); font-size: 11px; }
  .axiom-card h3 { margin: 8px 0 6px; font-size: 16px; letter-spacing: .3px; }
  .line { margin: 4px 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .science { color: var(--science); }
  .line .god { color: var(--god); }
  .line .bridge { color: var(--bridge); }
  .line .danger { color: var(--danger); }
  .progress {
    margin-top: 9px;
    height: 8px;
    border-radius: 6px;
    border: 1px solid #394d69;
    background: #0b1322;
    overflow: hidden;
  }
  .progress > span { display:block; height:100%; background: linear-gradient(90deg, #4874a8, #6dc8ff); }
  .footer {
    margin-top: 9px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 11px;
    color: var(--muted);
  }
  .gap-chip {
    border: 1px solid rgba(255, 107, 107, 0.45);
    color: #ff9494;
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 10px;
    margin-left: 6px;
  }
  .sym-ok { color: var(--good); }
  .sym-bad { color: var(--danger); }

  .detail {
    position: fixed;
    inset: 0;
    background: rgba(3, 7, 12, .84);
    display: none;
    z-index: 40;
  }
  .detail.open { display:block; }
  .detail-panel {
    margin: 2.5vh auto;
    width: min(1100px, 94vw);
    max-height: 95vh;
    overflow-y: auto;
    background: #0d1422;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .detail-top { display:flex; justify-content:space-between; gap: 8px; }
  .detail-top button {
    border: 1px solid #43577a;
    background: #1a2538;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .claim { color: var(--muted); margin-top: 4px; }
  .columns { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .section {
    background: #101a2a;
    border: 1px solid #2a3a55;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
  }
  .section h4 { margin: 0 0 8px; font-size: 13px; }
  .science-col h4 { color: var(--science); }
  .god-col h4 { color: var(--god); }
  .bridge-col h4 { color: var(--bridge); }
  .kill { color: var(--danger); font-weight: 600; }
  .product {
    margin-top: 10px;
    border: 1px solid #334661;
    border-radius: 10px;
    padding: 10px;
    background: #0b1321;
    font-size: 13px;
  }

  @media (max-width: 1000px) {
    .columns { grid-template-columns: 1fr; }
    .axiom-card { width: 270px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">
      <h1>Axiom Chain — Horizontal Mind Map</h1>
      <p>Scroll sideways. Click any card for full vertical detail page.</p>
    </div>
    <div class="scores">
      <div class="score" id="scoreTheo"></div>
      <div class="score" id="scoreEvo"></div>
    </div>
  </div>

  <main class="board" id="board">
    <div class="board-inner" id="boardInner"></div>
  </main>

  <div class="detail" id="detail">
    <div class="detail-panel">
      <div class="detail-top">
        <div>
          <div id="detailId" style="font-size:12px;color:#9ca9b8"></div>
          <h2 id="detailTitle" style="margin:2px 0 0"></h2>
          <div class="claim" id="detailClaim"></div>
        </div>
        <button onclick="closeDetail()">Close</button>
      </div>

      <div class="columns">
        <section class="section science-col">
          <h4>SCIENCE SIDE</h4>
          <div id="scienceFields"></div>
        </section>
        <section class="section god-col">

          <div id="godFields"></div>
        </section>
        <section class="section bridge-col">
          <h4>THE BRIDGE</h4>
          <div id="bridgeFields"></div>
        </section>
      </div>

      <div class="product" id="productFields"></div>
    </div>
  </div>

function frameworkScore(chain) {
  return chain.reduce((acc, a) => acc * Number(a.bridge || 0), 1);
}

function symmetryStatus(chain, index) {
  if (index === 0) return { ok: true, label: "seed" };
  const prev = chain[index - 1];
  const cur = chain[index];
  const prevHasGap = (prev.gaps || []).length > 0;
  const curHasGap = (cur.gaps || []).length > 0;
  if (prevHasGap || curHasGap) return { ok: false, label: "gap" };
  if (prev.convergence === "NO" || cur.convergence === "NO") return { ok: false, label: "mismatch" };
  return { ok: true, label: "mirror" };
}

function buildCard(a, index, chain, type) {
  const sym = symmetryStatus(chain, index);
  const gapTag = (a.gaps || []).slice(0, 2).map(g => `<span class="gap-chip">gap: ${g}</span>`).join("");
  const statusPct = Math.round((a.bridge || 0) * 100);
  return `
    <div class="card-wrap">
      <article class="axiom-card" data-type="${type}" data-id="${a.id}" onclick="openDetail('${type}','${a.id}')">
        <div class="meta"><span>${a.id}</span><span>${a.status.toUpperCase()}</span></div>
        <h3>${a.title}</h3>
        <div class="line"><span class="science">Science:</span> ${a.science}</div>
        <div class="line"><span class="god">${type === 'theo' ? 'God' : 'Philosophy'}:</span> ${a.god}</div>
        <div class="line"><span class="bridge">Bridge:</span> ${a.bridge.toFixed(2)} (${a.convergence})</div>
        <div class="line">Attestation: ${a.attestation}</div>
        <div class="progress"><span style="width:${statusPct}%"></span></div>
        <div class="footer">
          <span class="${sym.ok ? 'sym-ok' : 'sym-bad'}">symmetry: ${sym.label}</span>
          <span>click to expand</span>
        </div>
        <div style="margin-top:6px">${gapTag}</div>
      </article>
    </div>
  `;
}

function renderChain(title, subtitle, id, type, chain) {
  return `
    <section class="chain" id="${id}">
      <div class="chain-head"><strong>${title}</strong><span>${subtitle}</span></div>
      <div class="cards">
        ${chain.map((a, i) => buildCard(a, i, chain, type)).join("")}
      </div>
    </section>
  `;
}

function render() {
  const board = document.getElementById("boardInner");
  board.innerHTML = [
    renderChain("Theophysics Chain", "Master Equation framework", "theo", "theo", theophysicsChain),
    renderChain("Evolution Chain", "Naturalistic framework under same template", "evo", "evo", evolutionChain)
  ].join("");

  const theoScore = frameworkScore(theophysicsChain);
  const evoScore = frameworkScore(evolutionChain);

  document.getElementById("scoreTheo").innerHTML = `
    <strong>Theophysics χ</strong>
    Product form score: <b>${theoScore.toExponential(3)}</b><br/>
    Bridge mean: ${(theophysicsChain.reduce((a,b)=>a+b.bridge,0)/theophysicsChain.length).toFixed(2)}
  `;
  document.getElementById("scoreEvo").innerHTML = `
    <strong>Evolution χ</strong>
    Product form score: <b>${evoScore.toExponential(3)}</b><br/>
    Bridge mean: ${(evolutionChain.reduce((a,b)=>a+b.bridge,0)/evolutionChain.length).toFixed(2)}
  `;
}

function fieldRow(label, value, extraClass="") {
  return `<div style="margin-bottom:7px"><b>${label}:</b> <span class="${extraClass}">${value}</span></div>`;
}

function openDetail(type, id) {
  const chain = type === "theo" ? theophysicsChain : evolutionChain;
  const index = chain.findIndex(a => a.id === id);
  const a = chain[index];
  if (!a) return;

  document.getElementById("detail").classList.add("open");
  document.getElementById("detailId").textContent = `${a.id} • ${type === 'theo' ? 'Theophysics' : 'Evolution'} chain`;
  document.getElementById("detailTitle").textContent = a.title;
  document.getElementById("detailClaim").textContent = `${a.claim} | Status: ${a.status}`;
  document.getElementById("godHeading").textContent = type === 'theo' ? 'GOD SIDE' : 'PHILOSOPHY SIDE';

  document.getElementById("scienceFields").innerHTML = [
    fieldRow("Definition", a.scienceDef),
    fieldRow("Equation", a.equation),
    fieldRow("Evidence", a.evidence),
    fieldRow("Protocol", a.protocol),
    fieldRow("Kill Condition", a.scienceKill, "kill")
  ].join("");

  document.getElementById("godFields").innerHTML = [
    fieldRow(type === 'theo' ? "Primary Scripture" : "Worldview Anchor", a.scripture),
    fieldRow("Attestation Count", a.attCount),
    fieldRow("Independent Authors", a.authors),
    fieldRow("Temporal Span", a.span),
    fieldRow("Cross-Testament", a.crossTestament),
    fieldRow("Kill Condition", a.theologyKill, "kill")

  document.getElementById("bridgeFields").innerHTML = [
    fieldRow("Science Prediction", a.sciencePrediction),
    fieldRow("Theology/Philosophy Prediction", a.theologyPrediction),
    fieldRow("Convergence", a.convergence),
    fieldRow("Math Notation", a.notation),
    fieldRow("Isomorphism", a.iso)
  ].join("");

  const prev = chain[index - 1];
  const productStatement = `If ${a.id} = 0, then χ = 0.`;
  const symmetry = prev ? `Adjacent check with ${prev.id}: ${symmetryStatus(chain, index).label}.` : "Seed axiom has no predecessor.";

  document.getElementById("productFields").innerHTML = `
    <b>PRODUCT ACCOUNTABILITY</b><br/>
    ${productStatement}<br/>
    ${symmetry}<br/>
    Missing slots: ${(a.gaps || []).length ? a.gaps.join(", ") : "none"}
  `;
}

function closeDetail() {
  document.getElementById("detail").classList.remove("open");
}

document.getElementById("detail").addEventListener("click", (e) => {
  if (e.target.id === "detail") closeDetail();
});

render();
</script>
</body>
</html>
